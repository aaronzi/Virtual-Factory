[project]
name = "virtual-factory"
version = "0.1.0"
description = "Virtual Factory – workspace root (edge/IT services, tools, tests)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["vf-common", "provisioner", "bridge", "mes", "ops-gateway", "historian", "plc-comm", "edge", "sustainability", "resolver", "erp", "alarms", "supplier", "maintenance"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
vf-common = { workspace = true }
provisioner = { workspace = true }
bridge = { workspace = true }
mes = { workspace = true }
ops-gateway = { workspace = true }
historian = { workspace = true }
sustainability = { workspace = true }
plc-comm = { workspace = true }
edge = { workspace = true }
resolver = { workspace = true }
erp = { workspace = true }
alarms = { workspace = true }
maintenance = { workspace = true }
supplier = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "gdtoolkit>=4.3",
    "xmlschema>=3.4",
    "import-linter>=2.1",
    "aas-test-engines>=1.0",
    "pyyaml>=6",
    "pillow>=12.3.0",
]

[tool.pytest.ini_options]
testpaths = ["services", "tools/tests"]
markers = ["integration: needs the running docker compose stack (infra/)",
           "secure: needs the running SECURE compose stack (infra/docker-compose.secure.yml, ADR-0027)"]
addopts = "-m 'not integration and not secure'"
