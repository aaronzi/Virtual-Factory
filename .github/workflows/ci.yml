name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  python-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Python unit tests
        run: uv run pytest
      - name: Architecture conformance
        run: uv run tools/arch_check.py
      - name: Complexity limits
        run: uv run tools/complexity_check.py
      - name: GDScript lint
        working-directory: godot
        run: uv run gdlint .

  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT_PATH=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: GUT unit tests
        run: tools/run_godot_tests.sh
