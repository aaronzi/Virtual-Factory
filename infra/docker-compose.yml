# Virtual Factory – IT/edge infrastructure
#
# Usage (from repo root):  docker compose -f infra/docker-compose.yml up -d
# Compose project name "vf" keeps it separate from other BaSyx stacks on this machine.
#
# Host ports:
#   8091  BaSyx Go AAS Environment (repos, registries, discovery, concept descriptions)
#   3001  BaSyx AAS Web UI
#   8093  BaSyx Go DPP API      – digital product passports read from the AAS database (ADR-0021)
#   1883  MQTT (TCP)            – edge services, MQTT Explorer
#   9001  MQTT over WebSocket   – Godot shop-floor simulation
#   8092  Operaton BPMN engine  – Cockpit / Tasklist (/operaton/app/), REST (/engine-rest), local user demo/demo
#   8095  ops gateway           – AAS operation delegation target (health: /health)
#   1880  Node-RED              – optional learner sandbox, only with `--profile sandbox` (no auth)
#   3002  Grafana               – dashboard "LINE01 live" on the historian; anonymous read-only, login to edit
#   8096  Digital Link resolver – GS1 /01/<GTIN>/21/<serial>: passport page, linkset (ADR-0023)
#   8097  sustainability        – product carbon footprints, sustainability KPIs (ADR-0025)
#   8098  ERP simulator         – production orders, confirmations, batches; status page / (ADR-0025)
#   8099  alarms & events       – ISA-18.2 alarms, acknowledge/shelve, journal, alarm KPIs (ADR-0026)
#   8094  maintenance           – condition monitoring, RUL, maintenance orders (ADR-0029)
#   4840  OPC UA (plc-comm)     – PLC01 communication module, opc.tcp://localhost:4840/vf/plc01, None/Anonymous
#   4841  PLC backplane         – TCP link of the simulated PLC CPU (Godot) to plc-comm (ADR-0024)
#   8190  supplier portal       – despatch advices of the component suppliers, creates their batch AAS (ADR-0028)
#   8191  supplier AAS env.     – second, separately operated BaSyx Go environment of the suppliers (own DB)
#
# The database lives on tmpfs: every `up` starts with a fresh DB. The one-shot `provisioner` service builds the
# static AAS into ./basyx/preload, which BaSyx imports at startup (workpiece instances are ephemeral, ADR-0004).
# M4 services (ADR-0014..0017): bridge (UNS -> AAS via AIMC), mes (workpiece AAS, BPMN workers), ops-gateway
# (delegated AAS operations -> UNS commands), bpmn (Operaton). Service decomposition (ADR-0025/0026):
# sustainability (PCF), erp (orders), alarms + alarms-db (ISA-18.2, TimescaleDB), maintenance (predictive
# maintenance, ADR-0029). The Godot simulation runs on the host and connects
# to ws://localhost:9001. Supplier side (ADR-0028): supplier-db, supplier-config, supplier-provisioner, supplier-aas-env
# (port 8191) and the supplier portal; the plant's services reach it only through discovery/registry (VF_AAS_REGISTRIES)
# and the portal's REST API.

name: vf

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.42.0/24   # fixed, because BaSyx checks the resolved delegation address (ops-gateway)

x-supplier-registries: &supplier-registries
  # federation (ADR-0023/0028): own environment first, then the suppliers'; public descriptor URLs -> compose hosts
  VF_AAS_REGISTRIES: "vf=http://aas-env:8091,supplier=http://supplier-aas-env:8191"
  VF_AAS_ENDPOINT_MAP: "http://localhost:8091=http://aas-env:8091,http://localhost:8191=http://supplier-aas-env:8191"

x-postgres-env: &postgres-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: vf
  POSTGRES_PASSWORD: vf-local-only
  POSTGRES_DBNAME: basyx
  POSTGRES_MAXOPENCONNECTIONS: "50"
  POSTGRES_MAXIDLECONNECTIONS: "25"
  POSTGRES_CONNMAXLIFETIMEMINUTES: "5"
  POSTGRES_CONNMAXIDLETIMEMINUTES: "0"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: vf
      POSTGRES_PASSWORD: vf-local-only
      POSTGRES_DB: basyx
    tmpfs:
      - /var/lib/postgresql:size=1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vf -d basyx"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  basyx-config:
    image: eclipsebasyx/basyxconfigurationservice-go:1.1.0
    environment:
      <<: *postgres-env
    depends_on:
      db:
        condition: service_healthy

  provisioner:
    # One-shot: builds the static AAS (IDTA/custom templates + aas/data) into ./basyx/preload before BaSyx starts.
    build:
      context: ..
      dockerfile: services/Dockerfile
    image: vf-services:dev
    command: ["-m", "provisioner", "build", "--out", "/out", "--env-json", "/tmp/environment.json"]
    volumes:
      - ..:/repo:ro
      - ./basyx/preload:/out

  aas-env:
    image: eclipsebasyx/aasenvironment-go:1.1.0
    command: ["/app/aasenvironmentservice"]
    ports:
      - "8091:8091"
    environment:
      <<: *postgres-env
      SERVER_PORT: "8091"
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      ABAC_ENABLED: "false"
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_EXTERNALURL: http://localhost:8091
      GENERAL_AAS_PRECONFIG_PATHS: /app/preconfiguration
      LOGGING_LEVEL: info
      # MQTT eventing (CloudEvents, submodel granularity) on vf/basyx/... - used by the bridge to reload mappings
      BASYX_EVENTING_ENABLED: "true"
      BASYX_EVENTING_OUTBOX_ENABLED: "true"
      BASYX_EVENTING_SINKS: mqtt
      BASYX_EVENTING_MQTT_BROKER: mqtt://mqtt:1883
      BASYX_EVENTING_MQTT_CLIENT_ID: basyx-aas-env
      BASYX_EVENTING_TOPIC_PREFIX: vf/basyx
      # operation delegation targets (host and resolved address must be allow-listed)
      SMREPO_DELEGATION_TRUSTED_HOSTS: "ops-gateway:8095,172.30.42.95:8095,172.30.42.95"
    volumes:
      - ./basyx/preload:/app/preconfiguration:ro
    depends_on:
      basyx-config:
        condition: service_completed_successfully
      provisioner:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    restart: unless-stopped

  aas-ui:
    # aas-gui publishes no version tags; pinned by digest (latest as of 2026-09-24).
    image: eclipsebasyx/aas-gui@sha256:5e9ad866865267a0cf13f99d309a823e979c5bf945e63138b9a1268c9a884298
    ports:
      - "3001:3000"
    volumes:
      - ./basyx/basyx-infra.yml:/basyx-infra.yml:ro
    environment:
      ENDPOINT_CONFIG_AVAILABLE: "false"
    restart: unless-stopped

  dpp-api:
    # BaSyx Go Digital Product Passport API (ADR-0021) on the SAME database as aas-env: serves the item-level
    # passports the MES writes as workpiece AAS (DPP id = AAS id, product id = globalAssetId = GS1 Digital Link)
    # and the model-level passport of PC3280_TYPE. Read-only use; managed attachments (certificates, documents)
    # are linked to the AAS environment's attachment endpoints via GENERAL_EXTERNALURL. History endpoints are
    # not configured (aas-env runs without BaSyx history).
    image: eclipsebasyx/dppapi-go:1.1.0
    command: ["/app/dppapiservice"]
    ports:
      - "8093:8093"
    environment:
      <<: *postgres-env
      SERVER_PORT: "8093"
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      ABAC_ENABLED: "false"
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_EXTERNALURL: http://localhost:8091
      LOGGING_LEVEL: info
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      basyx-config:
        condition: service_completed_successfully
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  influxdb3:
    # Historian time-series database (ADR-0019): InfluxDB 3 Core, open source. No authentication (local use only);
    # data on tmpfs like the AAS DB - survives a container restart, wiped with `down`. SQL: /api/v3/query_sql,
    # writes: /api/v3/write_lp. Database "vf" is created by the first write of the historian.
    image: influxdb:3.12.0-core
    command: ["influxdb3", "serve", "--node-id", "vf", "--object-store", "file",
              "--data-dir", "/var/lib/influxdb3", "--without-auth"]
    ports:
      - "8181:8181"
    tmpfs:
      - /var/lib/influxdb3:size=2g,uid=1500,gid=1500,mode=0750
    restart: unless-stopped

  historian:
    image: vf-services:dev
    command: ["-m", "historian"]
    environment:
      VF_MQTT_URL: mqtt://mqtt:1883
      VF_INFLUX_URL: http://influxdb3:8181
      LOG_LEVEL: INFO
    volumes:
      - ..:/repo:ro
    depends_on:
      mqtt:
        condition: service_started
      influxdb3:
        condition: service_started
    restart: unless-stopped

  grafana:
    # Live dashboards on the historian (ADR-0022): data source InfluxDB 3 Core (SQL via Flight SQL) and the
    # dashboard "LINE01 live" are provisioned from ./grafana (read-only). Anonymous visitors are viewers; log in
    # as admin / editor (local default passwords, open issue O34) to edit. Saved edits and users persist in the
    # volume grafana-data; reset: `docker compose -f infra/docker-compose.yml rm -sf grafana &&
    # docker volume rm vf_grafana-data`.
    image: grafana/grafana:13.2.3
    entrypoint: ["/bin/sh", "/etc/grafana/vf-entrypoint.sh"]
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: virtualfactory   # local default (O34), applied when the volume is created
      VF_GRAFANA_EDITOR_PASSWORD: virtualfactory
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/entrypoint.sh:/etc/grafana/vf-entrypoint.sh:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb3:
        condition: service_started
      alarms-db:
        condition: service_healthy
    restart: unless-stopped

  bpmn:
    image: operaton/operaton:2.1.5
    ports:
      - "8092:8080"
    environment:
      OPERATON_BPM_RUN_EXAMPLE_ENABLED: "false"   # in-memory H2 per container: process data is ephemeral
    restart: unless-stopped

  bridge:
    image: vf-services:dev
    command: ["-m", "bridge"]
    environment: &service-env
      VF_AAS_URL: http://aas-env:8091
      VF_MQTT_URL: mqtt://mqtt:1883
      VF_BPMN_URL: http://bpmn:8080/engine-rest
      VF_AAS_PUBLIC_URL: http://localhost:8091
      VF_INFLUX_URL: http://influxdb3:8181
      LOG_LEVEL: INFO
    volumes:
      - ..:/repo:ro
    depends_on:
      aas-env:
        condition: service_started
    restart: unless-stopped

  mes:
    image: vf-services:dev
    command: ["-m", "mes"]
    environment:
      <<: *service-env
      VF_ERP_URL: http://erp:8098    # order confirmations (ProductionOrder: order-progress, order-confirm)
    volumes:
      - ..:/repo:ro
    depends_on:
      aas-env:
        condition: service_started
      bpmn:
        condition: service_started
    restart: unless-stopped

  ops-gateway:
    image: vf-services:dev
    command: ["-m", "ops_gateway"]
    environment:
      <<: *service-env
      VF_OPCUA_ENDPOINTS: &opcua-endpoints "opc.tcp://localhost:4840=opc.tcp://plc-comm:4840"
    ports:
      - "8095:8095"
    volumes:
      - ..:/repo:ro
    networks:
      default:
        ipv4_address: 172.30.42.95
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped

  plc-comm:
    # Communication module of PLC01 (ADR-0024): OPC UA server (address space after OPC 30050 PackML, engineered
    # from the FMI model description) on 4840; the simulated PLC CPU in Godot connects to the backplane port 4841
    # and feeds the process image. Without a CPU the values have the status BadNoCommunication.
    image: vf-services:dev
    command: ["-m", "plc_comm"]
    environment:
      VF_PLC_INSTANCE: PLC01
      LOG_LEVEL: INFO
    ports:
      - "4840:4840"
      - "4841:4841"
    volumes:
      - ..:/repo:ro
    restart: unless-stopped

  edge:
    # Edge connector (ADR-0024): subscribes to the OPC UA servers described in the AIDs (PLC01) and publishes their
    # data to the UNS (topics and payloads of godot/config/uns.json); UNS commands -> OPC UA method calls.
    image: vf-services:dev
    command: ["-m", "edge"]
    environment:
      <<: *service-env
      VF_OPCUA_ENDPOINTS: *opcua-endpoints
    volumes:
      - ..:/repo:ro
    depends_on:
      aas-env:
        condition: service_started
      plc-comm:
        condition: service_started
      mqtt:
        condition: service_started
    restart: unless-stopped

  sustainability:
    # Product carbon footprint (ADR-0025): BPMN worker pcf-calculate writes the CarbonFootprint submodel of each
    # packed workpiece (energy from the historian, supplier footprints per component batch: batch AAS in the
    # supplier environment via federated discovery, ADR-0028), plant energy/CO2e in the EnergyConsumption
    # submodels every 10 s; KPIs on :8097.
    image: vf-services:dev
    command: ["-m", "sustainability"]
    environment:
      <<: [*service-env, *supplier-registries]
    ports:
      - "8097:8097"
    volumes:
      - ..:/repo:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8097/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      aas-env:
        condition: service_started
      bpmn:
        condition: service_started
      influxdb3:
        condition: service_started
    restart: unless-stopped

  erp:
    # ERP order simulator (ADR-0025): production orders released to the MES as BPMN message OrderReleased
    # (ProductionOrder), confirmations (good, scrap, consumed lots), goods receipts / batch master data. Keeps
    # a standing order released (VF_ERP_AUTO_RELEASE) so the line always produces against an order. State in
    # memory (like the BPMN engine). Status page http://localhost:8098/.
    image: vf-services:dev
    command: ["-m", "erp"]
    environment:
      VF_BPMN_URL: http://bpmn:8080/engine-rest
      VF_SUPPLIER_URL: http://supplier:8190   # despatch advices for goods receipts (ADR-0028)
      VF_ERP_AUTO_RELEASE: "true"
      VF_ERP_STANDING_QTY: "48"
      LOG_LEVEL: INFO
    ports:
      - "8098:8098"
    volumes:
      - ..:/repo:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8098/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      bpmn:
        condition: service_started
    restart: unless-stopped

  alarms-db:
    # TimescaleDB of the alarms service (ADR-0026): alarm journal, occurrences, current alarm states and the UNS
    # event journal. Own instance, not the BaSyx PostgreSQL. tmpfs like the historian: survives a container
    # restart, wiped with `down`. No host port; psql: docker compose -f infra/docker-compose.yml exec alarms-db
    # psql -U vf_alarms alarms. Grafana reads it with the read-only role grafana.
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: vf_alarms
      POSTGRES_PASSWORD: vf-local-only
      POSTGRES_DB: alarms
      TIMESCALEDB_TELEMETRY: "off"
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vf_alarms -d alarms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alarms:
    # Alarms & events (ADR-0026): ISA-18.2 alarm management of the PLC alarms (UNS), event journal of all UNS
    # events, REST API :8099 (acknowledge, shelve, journal, KPIs).
    image: vf-services:dev
    command: ["-m", "alarms"]
    environment:
      VF_MQTT_URL: mqtt://mqtt:1883
      VF_ALARMS_DB: postgresql://vf_alarms:vf-local-only@alarms-db:5432/alarms
      LOG_LEVEL: INFO
    ports:
      - "8099:8099"
    volumes:
      - ..:/repo:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8099/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      alarms-db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  maintenance:
    # Predictive maintenance (ADR-0029): health index and remaining useful life of the monitored components
    # (infra/maintenance.json) from the historian every 10 s -> UNS {root}/maintenance/... (recorded by the
    # historian) and the ConditionMonitoring submodel; opens MaintenanceOrder processes (BPMN, deployed by the
    # MES) and executes their service tasks (ERP maintenance window, LineControl Maintain / SetUnitMode,
    # MaintenanceRecord, observed Reliability). REST :8094.
    image: vf-services:dev
    command: ["-m", "maintenance"]
    environment:
      <<: *service-env
      VF_ERP_URL: http://erp:8098
    ports:
      - "8094:8094"
    volumes:
      - ..:/repo:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8094/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      aas-env:
        condition: service_started
      bpmn:
        condition: service_started
      influxdb3:
        condition: service_started
      erp:
        condition: service_started
    restart: unless-stopped

  resolver:
    # GS1 Digital Link resolver (ADR-0023): the QR codes on the parts encode the canonical Digital Link
    # https://virtual-factory.example/01/<GTIN>/21/<serial>; clients re-base its path onto this resolver.
    # Resolves via discovery + registry (aas-env) and the DPP API; links handed to browsers use public URLs.
    image: vf-services:dev
    command: ["-m", "resolver"]
    environment:
      VF_AAS_URL: http://aas-env:8091
      VF_AAS_PUBLIC_URL: http://localhost:8091
      VF_DPP_URL: http://dpp-api:8093
      VF_DPP_PUBLIC_URL: http://localhost:8093
      VF_RESOLVER_PUBLIC_URL: http://localhost:8096
      LOG_LEVEL: INFO
    ports:
      - "8096:8096"
    volumes:
      - ..:/repo:ro
    depends_on:
      aas-env:
        condition: service_started
      dpp-api:
        condition: service_started
    restart: unless-stopped

  # -- supplier side (ADR-0028): a second, separately operated AAS environment hosting the supplier companies,
  # their product types and the batch AAS of delivered lots; own database, own preload, own port --------------
  supplier-db:
    image: postgres:18
    environment:
      POSTGRES_USER: vf
      POSTGRES_PASSWORD: vf-local-only
      POSTGRES_DB: basyx
    tmpfs:
      - /var/lib/postgresql:size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vf -d basyx"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  supplier-config:
    image: eclipsebasyx/basyxconfigurationservice-go:1.1.0
    environment:
      <<: *postgres-env
      POSTGRES_HOST: supplier-db
    depends_on:
      supplier-db:
        condition: service_healthy

  supplier-provisioner:
    # One-shot: builds the supplier data set (aas/data/supplier: companies, product types) into
    # ./basyx/preload-supplier. Batch AAS are created at runtime by the supplier portal.
    image: vf-services:dev
    command: ["-m", "provisioner", "build", "--data", "supplier", "--out", "/out",
              "--env-json", "/tmp/supplier-environment.json"]
    volumes:
      - ..:/repo:ro
      - ./basyx/preload-supplier:/out
    depends_on:
      provisioner:
        condition: service_completed_successfully   # same image, built by the provisioner service

  supplier-aas-env:
    image: eclipsebasyx/aasenvironment-go:1.1.0
    command: ["/app/aasenvironmentservice"]
    ports:
      - "8191:8191"
    environment:
      <<: *postgres-env
      POSTGRES_HOST: supplier-db
      SERVER_PORT: "8191"
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      ABAC_ENABLED: "false"
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_EXTERNALURL: http://localhost:8191
      GENERAL_AAS_PRECONFIG_PATHS: /app/preconfiguration
      LOGGING_LEVEL: info
    volumes:
      - ./basyx/preload-supplier:/app/preconfiguration:ro
    depends_on:
      supplier-config:
        condition: service_completed_successfully
      supplier-provisioner:
        condition: service_completed_successfully
    restart: unless-stopped

  supplier:
    # Supplier portal (ADR-0028): despatch advices (ASN) of the suppliers; publishes the batch AAS (batch PCF,
    # recycled content, material certificate EN 10204 3.1) in the supplier environment when a lot is despatched.
    image: vf-services:dev
    command: ["-m", "supplier"]
    environment:
      VF_AAS_URL: http://supplier-aas-env:8191
      VF_AAS_PUBLIC_URL: http://localhost:8191
      LOG_LEVEL: INFO
    ports:
      - "8190:8190"
    volumes:
      - ..:/repo:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8190/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      supplier-aas-env:
        condition: service_started
    restart: unless-stopped

  nodered:
    # Optional learner sandbox, outside the core data path. Only started with the "sandbox" profile:
    #   docker compose -f infra/docker-compose.yml --profile sandbox up -d nodered
    # Example flows are provisioned from infra/nodered/flows.json (read-only) into the named volume
    # nodered-data once (marker /data/.vf-seeded); later edits persist there. Reset to the repo examples:
    #   docker compose -f infra/docker-compose.yml rm -sf nodered && docker volume rm vf_nodered-data
    # No authentication (local use only).
    image: nodered/node-red:4.1.15-22
    profiles: ["sandbox"]
    ports:
      - "1880:1880"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        if [ ! -f /data/.vf-seeded ]; then
        rm -f /data/flows.json && cp /vf/flows.json /data/flows.json && touch /data/.vf-seeded; fi;
        exec ./entrypoint.sh --settings /vf/settings.js
    environment:
      TZ: UTC
    volumes:
      - ./nodered/flows.json:/vf/flows.json:ro
      - ./nodered/settings.js:/vf/settings.js:ro
      - nodered-data:/data
    healthcheck:  # the image's default check expects /data/settings.js; ours is /vf/settings.js
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1880/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped

volumes:
  nodered-data:   # Node-RED user dir of the sandbox (flows edited in the editor, installed palette nodes)
  grafana-data:   # Grafana database (users, dashboard edits saved in the UI)
