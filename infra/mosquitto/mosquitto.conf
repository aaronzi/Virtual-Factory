# Virtual Factory MQTT broker (local development only – anonymous access)
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Plain MQTT for edge/IT services and tools (MQTT Explorer, mosquitto_sub)
listener 1883
protocol mqtt
allow_anonymous true

# MQTT over WebSocket for the Godot simulation
listener 9001
protocol websockets
allow_anonymous true
