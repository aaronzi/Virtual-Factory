# Virtual Factory MQTT broker - SECURE profile (ADR-0027): no anonymous access, one account per client,
# topic ACLs per account. Accounts and ACL are generated from infra/security.yaml
# (uv run tools/gen_security_config.py); the passwords (local defaults, O34) are hashed at container start.
# TLS is not enabled (local training stack); production: listener 8883 with certfile/keyfile, wss for 9001.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/passwd
acl_file /vf/acl

# Plain MQTT for edge/IT services and tools (MQTT Explorer: account "explorer", read-only)
listener 1883
protocol mqtt

# MQTT over WebSocket for the Godot simulation (account "godot")
listener 9001
protocol websockets
