# Grafana of the Virtual Factory (ADR-0022): live dashboards on the historian (InfluxDB 3 Core).
# Anonymous visitors are read-only viewers; the login form (admin, editor - local defaults, see
# docs/user-guide.md, open issue O34) unlocks editing. Admin password: GF_SECURITY_ADMIN_PASSWORD (compose).

[server]
http_port = 3000
root_url = http://localhost:3002/

[security]
admin_user = admin
disable_gravatar = true
cookie_samesite = lax

[users]
allow_sign_up = false
allow_org_create = false

[auth]
disable_login_form = false

[auth.anonymous]
enabled = true
org_name = Virtual Factory
org_role = Viewer
hide_version = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[plugins]
# Use the data source plugins bundled in the image (InfluxDB 13.1.5) instead of downloading/updating them
# from grafana.com at every start: reproducible and works offline.
preinstall_disabled = true
preinstall_auto_update = false

[log]
level = warn
