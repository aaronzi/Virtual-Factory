[project]
name = "vf-common"
version = "0.1.0"
description = "Shared library for Virtual Factory edge/IT services: configuration, ID scheme, AAS builders, BaSyx REST access"
requires-python = ">=3.12"
dependencies = [
    "basyx-python-sdk>=2.2.0",
    "httpx>=0.28",
    "pyyaml>=6",
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vf_common"]
