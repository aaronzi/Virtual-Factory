[project]
name = "plc-comm"
version = "0.1.0"
description = "Communication module of PLC01: OPC UA server (address space after OPC 30050 PackML) fed by the simulated PLC CPU over a backplane link (ADR-0024)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["vf-common", "provisioner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plc_comm"]

[tool.uv.sources]
vf-common = { workspace = true }
provisioner = { workspace = true }
