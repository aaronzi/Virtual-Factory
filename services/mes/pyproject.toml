[project]
name = "mes"
version = "0.1.0"
description = "MES: production execution - orders from the ERP, workpiece instance AAS and passports, quality, KLT contents, ISO 22400 KPIs, BPMN external-task workers (Operaton)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["vf-common", "provisioner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mes"]

[tool.uv.sources]
vf-common = { workspace = true }
provisioner = { workspace = true }
