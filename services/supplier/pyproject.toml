[project]
name = "supplier"
version = "0.1.0"
description = "Supplier portal: despatch advices of the component suppliers and the batch AAS they publish in the supplier AAS environment (batch PCF, recycled content, material certificate EN 10204 3.1)"
requires-python = ">=3.12"
dependencies = ["vf-common", "provisioner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplier"]

[tool.uv.sources]
vf-common = { workspace = true }
provisioner = { workspace = true }
