[project]
name = "maintenance"
version = "0.1.0"
description = "Maintenance service: condition monitoring and predictive maintenance (health index, remaining useful life from the historian), owns ConditionMonitoring and the observed Reliability data, opens and executes MaintenanceOrder processes (BPMN)"
requires-python = ">=3.12"
dependencies = ["vf-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maintenance"]

[tool.uv.sources]
vf-common = { workspace = true }
