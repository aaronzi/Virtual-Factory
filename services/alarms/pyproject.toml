[project]
name = "alarms"
version = "0.1.0"
description = "Alarms & events service: ISA-18.2 alarm management of LINE01 (lifecycle, shelving, suppression by state), event journal of the UNS and alarm KPIs (EEMUA 191) in TimescaleDB"
requires-python = ">=3.12"
dependencies = ["vf-common", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alarms"]

[tool.uv.sources]
vf-common = { workspace = true }
