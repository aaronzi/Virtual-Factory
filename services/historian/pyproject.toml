[project]
name = "historian"
version = "0.1.0"
description = "Historian: records the UNS telemetry of all devices in InfluxDB 3 (one table per device, one field per FMI output)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["vf-common", "provisioner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/historian"]

[tool.uv.sources]
vf-common = { workspace = true }
provisioner = { workspace = true }
