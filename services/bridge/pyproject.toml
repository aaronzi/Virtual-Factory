[project]
name = "bridge"
version = "0.1.0"
description = "AIMC bridge: maps UNS (MQTT) telemetry into AAS submodel elements as configured by the Asset Interfaces Mapping Configuration"
requires-python = ">=3.12"
dependencies = [
    "lupa>=2.2",
    "vf-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.uv.sources]
vf-common = { workspace = true }
provisioner = { workspace = true }
