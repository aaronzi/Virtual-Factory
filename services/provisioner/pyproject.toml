[project]
name = "provisioner"
version = "0.1.0"
description = "Builds the static AAS of the Virtual Factory from IDTA/custom templates and asset data (AASX preload for BaSyx Go)"
requires-python = ">=3.12"
dependencies = ["vf-common", "pyyaml>=6", "httpx>=0.28"]

[project.scripts]
vf-provisioner = "provisioner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioner"]

[tool.uv.sources]
vf-common = { workspace = true }
