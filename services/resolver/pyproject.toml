[project]
name = "resolver"
version = "0.1.0"
description = "GS1 Digital Link resolver: product / item links (passport page, DPP, AAS, certificates) via discovery and registry"
requires-python = ">=3.12"
dependencies = ["vf-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolver"]

[tool.uv.sources]
vf-common = { workspace = true }
