# Shared definition of the LX12-R light barrier instances (LB01, LB02); per-instance files set tag, serial, position.
kind: Instance
assetType: https://virtual-factory.example/ids/assettype/PhotoelectricSensor
derivedFrom: LB_TYPE
thumbnail: repo:docs/screenshots/assets/light_barrier.png
device:
  modelDescription: godot/devices/light_barrier/model/modelDescription.xml
  energy: {power: power, energy: energy}
  operatingHours: operating_hours
  state: {variable: signal, map: {"true": ObjectDetected, "false": BeamClear}, initial: "false"}
submodels:
  - template: Nameplate-3.0
    values:
      ManufacturerName: {en: Lumetra Sensortechnik GmbH, de: Lumetra Sensortechnik GmbH}
      ManufacturerProductDesignation: {en: "Retro-reflective photoelectric sensor, polarised, PNP, M8", de: "Reflexionslichtschranke, polarisiert, PNP, M8"}
      ManufacturerProductFamily: {en: LX12, de: LX12}
      ManufacturerProductType: LX12-R
      OrderCodeOfManufacturer: LX12-R-P4M8
      URIOfTheProduct: https://virtual-factory.example/lumetra/products/LX12-R
      CountryOfOrigin: DE
      HardwareVersion: "2.0"
      FirmwareVersion: "1.3.0"
      YearOfConstruction: "2025"
      AddressInformation: {$include: common/address_lumetra.yaml}
      Markings: [{$include: common/marking_ce.yaml}]
  - template: EnergyConsumption-1.0
    values:
      $include: common/energy_defaults.yaml
      RatedPower: 1.2
      StandbyPower: 1.2
      PowerSupply: {RatedVoltage: 24, Frequency: 0, RatedCurrent: 0.05}
  - template: CapabilityDescription-1.0
    values:
      CapabilitySet:
        _idShort: CapabilitySet
        CapabilityContainer:
          - _idShort: DetectPresenceContainer
            Capability: {_idShort: DetectPresence, _semanticId: "https://virtual-factory.example/ids/capability/DetectPresence"}
            CapabilityComment: {en: "Detects a workpiece interrupting the light beam across the conveyor", de: "Erkennt ein Werkstück, das den Lichtstrahl quer zum Förderband unterbricht"}
            PropertySet:
              - _idShort: DetectPresenceProperties
                PropertyContainer:
                  - _idShort: SensingRangeContainer
                    PropertyRange: {_idShort: SensingRange, min: 0.05, max: 6.0}
                    PropertyComment: {en: "Sensing range with reflector R50 [m]", de: "Tastweite mit Reflektor R50 [m]"}
                  - _idShort: ResponseTimeContainer
                    PropertyProperty: {_idShort: ResponseTime, value: "0.0005"}
                    PropertyComment: {en: "Response time of the switching output [s]", de: "Ansprechzeit des Schaltausgangs [s]"}
