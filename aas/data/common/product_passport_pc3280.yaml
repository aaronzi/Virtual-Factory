  TextStatement:
    - {en: "Theoretical forces are calculated from the piston areas at 6 bar; the effective force is reduced by friction.", de: "Die theoretischen Kräfte sind aus den Kolbenflächen bei 6 bar berechnet; die effektive Kraft ist um die Reibung geringer."}
