# Batch profiles of the supplier portal (services/supplier, ADR-0028): how each supplier article forms its lots
# and which batch-specific values its batch AAS and material certificate state. Simulation parameters, not AAS
# data (not loaded by the provisioner). Keys = tag of the supplier's product type AAS (aas/data/supplier/assets).
#
#   lot.pattern     regex of the supplier's lot numbers (the lots AC01 stages, component_lots.gd); named group
#                   `date` (YYMMDD, die caster: one cast lot per day) or `seq` (sequence number)
#   lot.firstSeq/firstDate/daysPerLot   production date of sequence lots: firstDate + (seq - firstSeq) x days
#   quantity        pieces per lot (= parts per feeder lot in component_lots.gd x BulkCount)
#   pcf             batch PCF = declared x (1 + spread x (2u - 1)) - recycledCredit x (recycled - declared
#                   recycled), u from the lot (process energy of the batch); declared = type CarbonFootprint
#   recycled        declared average recycled content (%), identical to the PC-32 passport fragment; per lot
#                   +-15 % (vf_common.lot_values.recycled_share - the MES passport states the same values)
#   certificate     EN 10204 3.1 content: [characteristic, unit, min, max]; measured values within the limits
