title: UR5e carbon footprint
subtitle: Explanatory statement - operator estimate (cradle-to-gate, A1-A3)
organization: VF Pneumatics GmbH
version: '1.0'
date: '2025-09-15'
sections:
- heading: Status of the value
  text: >-
    The value of 900 kg CO2e per robot is an estimate of the plant operator VF Pneumatics GmbH for its own carbon
    accounting. No product carbon footprint declared by the manufacturer was available to the operator at the time
    of calculation. The value must be replaced as soon as a manufacturer PCF is available.
