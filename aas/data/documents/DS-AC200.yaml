title: "AC-200 assembly and test cell"
subtitle: "Data sheet"
organization: VF Automation Systems GmbH
version: "1.2"
date: "2025-07-01"
sections:
  - heading: Description
    text: >-
      Enclosed assembly and test cell for ISO 15552 profile cylinders. The cell pre-assembles piston and rod, inserts
      the seals, joins barrel and end caps, tightens the end-cap screws, performs a pressure-decay leak test and a
      full-stroke function test, fits the protective cap and releases the finished cylinder onto the downstream
      conveyor. The cell is integrated as a black box via a hard-wired handshake and MQTT.
