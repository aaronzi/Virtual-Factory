title: LC-10 line controller
subtitle: Data sheet
organization: VF Automation Systems GmbH
version: '1.2'
date: '2025-06-01'
sections:
- heading: Description
  text: >-
    Fanless industrial PC with real-time Linux and an IEC 61131-3 soft-PLC runtime for the control of small assembly
    and inspection lines. Includes a PackML (ISA-TR88.00.02) state machine library and an MQTT client for the Unified
    Namespace. Not a safety controller.
- heading: Processor and runtime
  rows:
  - [Processor, 'x86-64 quad-core, 2.0 GHz, fanless']
  - [Memory, '4 GB RAM, 32 GB eMMC']
  - [Operating system, real-time Linux (PREEMPT_RT)]
  - [Runtime, 'IEC 61131-3 (ST, SFC, FBD, LD)']
  - [Task cycle time, 10 ms configured (min. 1 ms)]
- heading: Communication
  rows:
  - [Ethernet, '2 x 10/100/1000 Mbit/s, RJ45']
  - [Messaging, 'MQTT 3.1.1 client, JSON payload']
  - [OPC UA, 'server with PackML companion specification (planned,']
  - ['', firmware 5.0)]
  - [I/O, 16 DI / 16 DO 24 V DC on-board]
- heading: Electrical and mechanical
  rows:
  - [Supply voltage, '24 V DC (19.2 ... 28.8 V), SELV/PELV']
  - [Power consumption, 25 W incl. on-board I/O]
  - [Mounting, DIN rail TS35]
  - [Dimensions, 150 x 110 x 60 mm]
  - [Mass, 0.9 kg]
  - [Degree of protection, IP20]
  - [Ambient temperature, 0 ... 55 °C]
