    rows: [[Working distance, "150 mm ± 20 mm"], [Light spot, "Ø 6 mm at 150 mm"], [Light source, "White LED, 5600 K"],
           [Colour space, "CIELAB, ΔE*ab"], [Integration time, "1 ... 500 ms (150 ms set)"], [Repeatability, "ΔE ≤ 0.5"]]
  - heading: Electrical data
    rows: [[Supply voltage, "18 ... 30 V DC"], [Power consumption, "2.5 W"], [Interface, "IO-Link 1.1, COM3"],
           [Switching output, "PNP, 100 mA"], [Connection, "M12, 5-pin, A-coded"]]
  - heading: Mechanical data
    rows: [[Housing, "Die-cast zinc, glass window"], [Protection, "IP65"], [Weight, "180 g"], [Ambient temperature, "-10 ... +55 °C"]]
