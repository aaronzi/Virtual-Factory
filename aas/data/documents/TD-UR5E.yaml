title: UR5e technical data summary
subtitle: Compiled by the integrator for the plant documentation of LINE01
organization: VF Automation Systems GmbH
version: '1.0'
date: '2025-08-01'
sections:
- heading: Scope and source
  text: >-
    This sheet summarises the public data sheet values of the collaborative robot UR5e (manufacturer: Universal
    Robots A/S, Odense, Denmark) as used for the engineering of the robot cell RB01. It is an integrator document
    of VF Automation Systems GmbH and does not replace the manufacturer's documentation; in case of deviations the
    manufacturer's current user manual and data sheet prevail.
