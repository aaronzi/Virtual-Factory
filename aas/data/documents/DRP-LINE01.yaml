title: Data retention policy VFP-DRP-2025-03
subtitle: Product-instance data on the AAS server of LINE01
organization: VF Pneumatics GmbH
version: '1.0'
date: '2025-09-15'
sections:
- heading: Scope
  text: >-
    Applies to the process and quality records of product-instance Asset Administration Shells (workpieces PC3280-YYYY-NNNNNN)
    that the MES creates on the AAS server of LINE01: submodels ExecutedProcesses, QualityInspection and MeasurementValue.
- heading: Rule
  rows:
  - [Retention on the line server, '24 hours (one production session), then deletion']
  - ['', permitted]
  - [Archive, the MES exports the records to the plant archive at the]
  - ['', end of each session]
  - [Product passport data, not affected; handled by the DPP process of VF]
  - ['', Pneumatics]
  - [Immutability, policy may be changed by Production IT]
  - [Effective from, '2025-09-15']
- heading: Responsibility
  text: >-
    Issued by VF Pneumatics GmbH, Production IT. Changes are recorded in the audit log of the DataRetentionPolicies
    submodel of LINE01.
