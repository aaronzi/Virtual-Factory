- heading: Richtlinien / Directives
  text: >-
    Die Gesamtheit von Maschinen entspricht allen einschlägigen Bestimmungen der Maschinenrichtlinie 2006/42/EG
    sowie der EMV-Richtlinie 2014/30/EU. The assembly of machines fulfils all relevant provisions of the Machinery
    Directive 2006/42/EC and of the EMC Directive 2014/30/EU. Die unvollständige Maschine UR5e wurde gemäß ihrer
    Einbauerklärung eingebaut / The partly completed machinery UR5e was incorporated according to its declaration
    of incorporation.
