            ProcessDescription: {en: "Measure the colour of the protective cap and compare it with the taught reference (CIE76 colour difference).", de: "Farbe der Schutzkappe messen und mit der eingelernten Referenz vergleichen (Farbabstand CIE76)."}
            PlannedProcessTime: PT0.5S
            ProductParameters:
              "+ReferenceColourR": {valueType: xs:double, value: 0.78, description: {en: "Reference colour, sRGB red component (0..1)", de: "Referenzfarbe, sRGB-Rotanteil (0..1)"}}
              "+ReferenceColourG": {valueType: xs:double, value: 0.08, description: {en: "Reference colour, sRGB green component (0..1)", de: "Referenzfarbe, sRGB-Grünanteil (0..1)"}}
              "+ReferenceColourB": {valueType: xs:double, value: 0.10, description: {en: "Reference colour, sRGB blue component (0..1)", de: "Referenzfarbe, sRGB-Blauanteil (0..1)"}}
              "+ReferenceColourLab": {value: "L* 42.3, a* 64.4, b* 46.6 (D65/2°)", description: {en: "Reference colour in CIELAB", de: "Referenzfarbe in CIELAB"}}
            ProcessParameters:
              "+DeltaE76Max": {valueType: xs:double, value: 25, description: {en: "Maximum colour difference ΔE*ab (CIE76)", de: "Maximaler Farbabstand ΔE*ab (CIE76)"}}
              "+MeasurementZone": {value: "protective cap, 190-235 mm above belt", description: {en: "Measurement zone", de: "Messzone"}}
            ResourceParameters:
              "+RequiredCapability": {valueType: xs:anyURI, value: "https://virtual-factory.example/ids/capability/InspectColour", description: {en: "Required capability of the resource", de: "Benötigte Fähigkeit der Ressource"}}
              "+Resource": {valueType: xs:anyURI, value: "${aas:QS01}", description: {en: "Assigned resource (AAS identifier)", de: "Zugeordnete Ressource (AAS-Kennung)"}}
              "+Illumination": {value: "white LED ring light, D65-like", description: {en: "Illumination", de: "Beleuchtung"}}
            ProcessBoM: {}
          - _idShort: OP90
            ProcessId: OP90
            ProcessName: Sort and pack
            ProcessDescription: {en: "Pick the inspected cylinder and place good parts in KLT A, rejects in KLT B (12 parts per KLT).", de: "Geprüften Zylinder greifen und Gutteile in KLT A, Schlechtteile in KLT B ablegen (12 Teile je KLT)."}
            PlannedProcessTime: PT7S
            ProductParameters:
              "+GripPosition": {value: "barrel, 85 mm above the rear face", description: {en: "Grip position on the part", de: "Greifposition am Teil"}}
              "+PartMass": {unit: "kg", valueType: xs:double, value: 0.59, description: {en: "Part mass", de: "Teilemasse"}}
            ProcessParameters:
              "+KltCapacity": {valueType: xs:unsignedInt, value: 12, description: {en: "Parts per KLT", de: "Teile je KLT"}}
              "+GoodDestination": {valueType: xs:anyURI, value: "${aas:KLTA01}", description: {en: "Destination of good parts (AAS identifier)", de: "Ziel der Gutteile (AAS-Kennung)"}}
              "+RejectDestination": {valueType: xs:anyURI, value: "${aas:KLTB01}", description: {en: "Destination of rejected parts (AAS identifier)", de: "Ziel der Schlechtteile (AAS-Kennung)"}}
            ResourceParameters:
              "+RequiredCapabilities": {value: "https://virtual-factory.example/ids/capability/PickAndPlace https://virtual-factory.example/ids/capability/Sort", description: {en: "Required capabilities of the resource (space-separated IRIs)", de: "Benötigte Fähigkeiten der Ressource (leerzeichengetrennte IRIs)"}}
              "+Resource": {valueType: xs:anyURI, value: "${aas:RB01}", description: {en: "Assigned resource (AAS identifier)", de: "Zugeordnete Ressource (AAS-Kennung)"}}
              "+GripWidth": {unit: "mm", valueType: xs:double, value: 44, description: {en: "Gripper jaw opening at grip", de: "Backenöffnung beim Greifen"}}
              "+GripForce": {unit: "N", valueType: xs:double, value: 40, description: {en: "Gripping force", de: "Greifkraft"}}
            ProcessBoM: {}

  - template: ManufacturingRecipe-1.1
    values:
      RecipeHeader:
        RecipeId: MR-PC3280
        RecipeVersion: "1.0"
        RecipeName: {en: "Master recipe PC-32-80-DA-M, LINE01", de: "Grundrezept PC-32-80-DA-M, LINE01"}
        RecipeType: MasterRecipe
        ProductReference: {ref: "aas:PC3280_TYPE"}
        LotSizeBasis: 1
        ApprovalStatus: Released
        ValidFrom: "2025-09-15"
        Author: "VF Pneumatics GmbH, Manufacturing Engineering"
        ChangeDescription: {en: "Initial release for the commissioning of LINE01.", de: "Erstfreigabe zur Inbetriebnahme von LINE01."}
      Formula:
        # acceptance limits; setpoints are referenced from the IDTA ProcessParameters submodel (single source)
        Parameters:
          Parameter:
            - {_idShort: TorquePiston, ParameterId: TorquePiston, ParameterName: {en: "Tightening torque piston on rod", de: "Anzugsmoment Kolben auf Stange"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP10.ProductParameters.PistonTighteningTorque"}, LowerLimit: 7.5, UpperLimit: 8.5, Unit: "N.m"}
            - {_idShort: GreaseQuantity, ParameterId: GreaseQuantity, ParameterName: {en: "Assembly grease quantity", de: "Montagefettmenge"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP20.ProcessParameters.GreaseQuantity"}, LowerLimit: 0.10, UpperLimit: 0.20, Unit: g}
            - {_idShort: InsertionForceMax, ParameterId: InsertionForceMax, ParameterName: {en: "Maximum insertion force piston assembly", de: "Maximale Einschubkraft Kolbenbaugruppe"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP30.ProcessParameters.InsertionForceMax"}, UpperLimit: 200, Unit: N}
            - {_idShort: TorqueEndCap, ParameterId: TorqueEndCap, ParameterName: {en: "Tightening torque end-cap screws M5", de: "Anzugsmoment Deckelschrauben M5"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP40.ProductParameters.TighteningTorque"}, LowerLimit: 5.5, UpperLimit: 6.5, Unit: "N.m"}
            - {_idShort: TestPressure, ParameterId: TestPressure, ParameterName: {en: "Leak test pressure (gauge)", de: "Prüfdruck Dichtheitsprüfung (Überdruck)"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP50.ProcessParameters.TestPressure"}, LowerLimit: 5.9, UpperLimit: 6.1, Unit: bar}
            - {_idShort: LeakRateMax, ParameterId: LeakRateMax, ParameterName: {en: "Maximum leak rate", de: "Maximale Leckrate"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP50.ProductParameters.LeakRateMax"}, UpperLimit: 1.0, Unit: "cm3/min"}
            - {_idShort: SupplyPressure, ParameterId: SupplyPressure, ParameterName: {en: "Function test supply pressure (gauge)", de: "Versorgungsdruck Funktionsprüfung (Überdruck)"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP60.ProcessParameters.SupplyPressure"}, LowerLimit: 5.8, UpperLimit: 6.2, Unit: bar}
            - {_idShort: StrokeTime, ParameterId: StrokeTime, ParameterName: {en: "Stroke time at 6 bar without load", de: "Hubzeit bei 6 bar ohne Last"}, NominalValue: "0.32", LowerLimit: 0.28, UpperLimit: 0.36, Unit: s}
            - {_idShort: CapPressForceMax, ParameterId: CapPressForceMax, ParameterName: {en: "Maximum press-on force protective cap", de: "Maximale Aufdrückkraft Schutzkappe"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP70.ProcessParameters.PressOnForceMax"}, UpperLimit: 50, Unit: N}
            - {_idShort: BeltSpeed, ParameterId: BeltSpeed, ParameterName: {en: "Conveyor belt speed", de: "Bandgeschwindigkeit"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP75.ProcessParameters.BeltSpeed"}, LowerLimit: 0.20, UpperLimit: 0.30, Unit: "m/s"}
            - {_idShort: ReferenceColour, ParameterId: ReferenceColour, ParameterName: {en: "Reference colour of the protective cap (sRGB)", de: "Referenzfarbe der Schutzkappe (sRGB)"}, NominalValue: "0.78 0.08 0.10", Unit: "1"}
            - {_idShort: DeltaEMax, ParameterId: DeltaEMax, ParameterName: {en: "Maximum colour difference ΔE*ab (CIE76)", de: "Maximaler Farbabstand ΔE*ab (CIE76)"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP80.ProcessParameters.DeltaE76Max"}, LowerLimit: 0, UpperLimit: 25, Unit: "1"}
            - {_idShort: KltCapacity, ParameterId: KltCapacity, ParameterName: {en: "Parts per KLT", de: "Teile je KLT"}, ProcessParameterReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP90.ProcessParameters.KltCapacity"}, Unit: "{pcs}"}
        Inputs:
          Input:
            - {_idShort: Barrel, MaterialId: "5032-1001", Quantity: 1, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.Barrel"}}
            - {_idShort: EndCapFront, MaterialId: "5032-1002", Quantity: 1, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.EndCapFront"}}
            - {_idShort: EndCapRear, MaterialId: "5032-1003", Quantity: 1, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.EndCapRear"}}
            - {_idShort: PistonRod, MaterialId: "5032-1004", Quantity: 1, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.PistonRod"}}
            - {_idShort: Piston, MaterialId: "5032-1005", Quantity: 1, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.Piston"}}
            - {_idShort: SealKit, MaterialId: "5032-1006", Quantity: 1, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.SealKit"}}
            - {_idShort: ScrewM5x16, MaterialId: "9001-0516", Quantity: 8, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.ScrewM5x16"}}
            - {_idShort: CushioningScrew, MaterialId: "5032-1008", Quantity: 2, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.CushioningScrew"}}
            - {_idShort: ProtectiveCap, MaterialId: "5032-1009", Quantity: 1, Unit: "{pcs}", BomNode: {ref: "sm:PC3280_TYPE/HierarchicalStructures#EntryNode.ProtectiveCap"}}
        Outputs:
          Output:
            - {_idShort: Cylinder, MaterialId: "5032-0080", Quantity: 1, Unit: "{pcs}"}
      EquipmentRequirements:
        Requirement:
          - {_idShort: R_Assembly, RequirementId: R-ASSY, RequiredCapability: "https://virtual-factory.example/ids/capability/AssembleCylinder", Description: {en: "Join piston, rod, seals, barrel and end caps; multi-spindle nutrunner up to 12 N·m", de: "Kolben, Stange, Dichtungen, Rohr und Deckel fügen; Mehrfachschrauber bis 12 N·m"}, CandidateResource: {ref: "aas:AC01"}}
          - {_idShort: R_LeakTest, RequirementId: R-LEAK, RequiredCapability: "https://virtual-factory.example/ids/capability/LeakTest", Description: {en: "Pressure-decay leak test at 6 bar, resolution 0.01 cm³/min", de: "Druckabfall-Dichtheitsprüfung bei 6 bar, Auflösung 0,01 cm³/min"}, CandidateResource: {ref: "aas:AC01"}}
          - {_idShort: R_FunctionTest, RequirementId: R-FUNC, RequiredCapability: "https://virtual-factory.example/ids/capability/FunctionTest", Description: {en: "Stroke time measurement in both directions at 6 bar", de: "Hubzeitmessung in beide Richtungen bei 6 bar"}, CandidateResource: {ref: "aas:AC01"}}
          - {_idShort: R_FitCap, RequirementId: R-CAP, RequiredCapability: "https://virtual-factory.example/ids/capability/FitProtectiveCap", Description: {en: "Press-fit of the protective cap, force-monitored", de: "Aufdrücken der Schutzkappe, kraftüberwacht"}, CandidateResource: {ref: "aas:AC01"}}
          - {_idShort: R_Transport, RequirementId: R-TRANS, RequiredCapability: "https://virtual-factory.example/ids/capability/Transport", Description: {en: "Upright transport of parts up to 1 kg at 0.25 m/s", de: "Stehender Transport von Teilen bis 1 kg mit 0,25 m/s"}, CandidateResource: {ref: "aas:CV01"}}
          - {_idShort: R_InspectColour, RequirementId: R-COLOUR, RequiredCapability: "https://virtual-factory.example/ids/capability/InspectColour", Description: {en: "CIELAB colour measurement with taught reference, ΔE*ab output", de: "CIELAB-Farbmessung mit eingelernter Referenz, Ausgabe ΔE*ab"}, CandidateResource: {ref: "aas:QS01"}}
          - {_idShort: R_PickAndPlace, RequirementId: R-PICK, RequiredCapability: "https://virtual-factory.example/ids/capability/PickAndPlace", Description: {en: "Pick from the conveyor and place into KLT slots, payload ≥ 1 kg", de: "Vom Band greifen und in KLT-Fächer ablegen, Traglast ≥ 1 kg"}, CandidateResource: {ref: "aas:RB01"}}
          - {_idShort: R_Sort, RequirementId: R-SORT, RequiredCapability: "https://virtual-factory.example/ids/capability/Sort", Description: {en: "Assign good parts to KLT A and rejects to KLT B", de: "Gutteile KLT A und Schlechtteile KLT B zuordnen"}, CandidateResource: {ref: "aas:RB01"}}
      Procedure:
        ProcedureModel: repo:bpmn/workpiece_lifecycle.bpmn
        Step:
          - {_idShort: OP10, StepId: OP10, StepName: {en: Pre-assemble piston and rod, de: Kolben und Kolbenstange vormontieren}, StepType: Operation, Sequence: 1, RequirementRef: R-ASSY, AssignedResource: {ref: "aas:AC01"}, ParameterRefs: TorquePiston, PlannedDuration: PT2S, QualityRelevant: true, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP10"}, ExecutionElement: Task_CreateWorkpieceAas}
          - {_idShort: OP20, StepId: OP20, StepName: {en: Insert seals, de: Dichtungen einsetzen}, StepType: Operation, Sequence: 2, Predecessors: OP10, RequirementRef: R-ASSY, AssignedResource: {ref: "aas:AC01"}, ParameterRefs: GreaseQuantity, PlannedDuration: PT1.5S, QualityRelevant: false, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP20"}, ExecutionElement: Task_CreateWorkpieceAas}
          - {_idShort: OP30, StepId: OP30, StepName: {en: Insert piston assembly into barrel, de: Kolbenbaugruppe in Rohr einsetzen}, StepType: Operation, Sequence: 3, Predecessors: OP20, RequirementRef: R-ASSY, AssignedResource: {ref: "aas:AC01"}, ParameterRefs: InsertionForceMax, PlannedDuration: PT1.5S, QualityRelevant: false, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP30"}, ExecutionElement: Task_CreateWorkpieceAas}
          - {_idShort: OP40, StepId: OP40, StepName: {en: Mount end caps and tighten screws, de: Deckel montieren und Schrauben anziehen}, StepType: Operation, Sequence: 4, Predecessors: OP30, RequirementRef: R-ASSY, AssignedResource: {ref: "aas:AC01"}, ParameterRefs: TorqueEndCap, PlannedDuration: PT2.5S, QualityRelevant: true, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP40"}, ExecutionElement: Task_CreateWorkpieceAas}
          - {_idShort: OP50, StepId: OP50, StepName: {en: Leak test, de: Dichtheitsprüfung}, StepType: Operation, Sequence: 5, Predecessors: OP40, RequirementRef: R-LEAK, AssignedResource: {ref: "aas:AC01"}, ParameterRefs: "TestPressure, LeakRateMax", PlannedDuration: PT2S, QualityRelevant: true, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP50"}, ExecutionElement: Task_CreateWorkpieceAas}
          - {_idShort: OP60, StepId: OP60, StepName: {en: Function test, de: Funktionsprüfung}, StepType: Operation, Sequence: 6, Predecessors: OP50, RequirementRef: R-FUNC, AssignedResource: {ref: "aas:AC01"}, ParameterRefs: "SupplyPressure, StrokeTime", PlannedDuration: PT1.5S, QualityRelevant: true, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP60"}, ExecutionElement: Task_CreateWorkpieceAas}
          - {_idShort: OP70, StepId: OP70, StepName: {en: Fit protective cap, de: Schutzkappe aufsetzen}, StepType: Operation, Sequence: 7, Predecessors: OP60, RequirementRef: R-CAP, AssignedResource: {ref: "aas:AC01"}, ParameterRefs: CapPressForceMax, PlannedDuration: PT1S, QualityRelevant: false, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP70"}, ExecutionElement: Task_CreateWorkpieceAas}
          - {_idShort: OP75, StepId: OP75, StepName: {en: Transport to inspection, de: Transport zur Prüfung}, StepType: Operation, Sequence: 8, Predecessors: OP70, RequirementRef: R-TRANS, AssignedResource: {ref: "aas:CV01"}, ParameterRefs: BeltSpeed, PlannedDuration: PT11S, QualityRelevant: false, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP75"}, ExecutionElement: Task_RecordInspection}
          - {_idShort: OP80, StepId: OP80, StepName: {en: Colour inspection of the protective cap, de: Farbprüfung der Schutzkappe}, StepType: Operation, Sequence: 9, Predecessors: OP75, RequirementRef: R-COLOUR, AssignedResource: {ref: "aas:QS01"}, ParameterRefs: "ReferenceColour, DeltaEMax", PlannedDuration: PT0.5S, QualityRelevant: true, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP80"}, ExecutionElement: Task_RecordInspection}
          - {_idShort: OP90, StepId: OP90, StepName: {en: Sort and pack, de: Sortieren und Verpacken}, StepType: Operation, Sequence: 10, Predecessors: OP80, RequirementRef: "R-PICK, R-SORT", AssignedResource: {ref: "aas:RB01"}, ParameterRefs: KltCapacity, PlannedDuration: PT7S, QualityRelevant: false, ProcessReference: {ref: "sm:PC3280_TYPE/ProcessParameters#Processes.OP90"}, ExecutionElement: Task_RecordPacking}

