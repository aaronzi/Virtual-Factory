  - template: MaintenanceInstructions-1.0
    values:
      MaintenanceFreeAsset: false
      MaintenanceInstructionsForSpecificInterval:
        - _idShort: BeltTrackingAndTension
          BasicMaintenanceInformation:
            # upstream template defect: semanticId is a ModelReference with key type 'Identifiable' (rejected by the
            # strict build); re-declared here as ExternalReference/GlobalReference with the same IRI
            _semanticId: https://admin-shell.io/idta/maintenanceinstructions/basicmaintenanceinformation/1/0
            MaintenanceID: CV01-M01
            NameOfMaintenance: {en: Belt tracking and tension check, de: Prüfung von Gurtlauf und Gurtspannung}
            SourceOfMaintenanceInstructions: {en: "Machine manufacturer (OM-BC3000, chapter 7)", de: "Maschinenhersteller (OM-BC3000, Kapitel 7)"}
            IntervalSpecification: {MaintenanceIntervalValue: 1, MaintenanceIntervalUnit: month}
            RelatedStandardsLawsRegulations: [{en: "EN 620 (continuous handling equipment, belt conveyors)", de: "EN 620 (Stetigförderer, Gurtförderer)"}]
            SafetyRegulationsToBeObserved:
              - {en: "Switch off and lock out the main switch of LINE01 before opening the drum guards.", de: "Vor dem Öffnen der Trommelschutzabdeckungen den Hauptschalter von LINE01 ausschalten und sichern."}
          MaintenanceTechnicians:
            NumberOfRequiredTechnicians: 1
            RequiredQualification: [{en: "Trained maintenance personnel (mechanics)", de: "Unterwiesenes Instandhaltungspersonal (Mechanik)"}]
            EstimatedTotalWorkingTime: {ValueTotalEstimatedWorkingTime: 20, UnitValueTotalEstimatedWorkingTime: min}
          ListMaintenanceSteps:
            MaintenanceStep:
              - _idShort: Step01
                MaintenanceStepID: "10"
                MaintenanceStepName: {en: Visual inspection, de: Sichtprüfung}
                LocalizationDescription: {en: Belt top and edges over the full length, de: Gurtoberseite und Gurtkanten über die gesamte Länge}
                InstructionMaintenanceStep: {en: "Run the belt in jog mode at 0.1 m/s and check the belt for cuts, frayed edges and contamination.", de: "Gurt im Tippbetrieb mit 0,1 m/s laufen lassen und auf Schnitte, ausgefranste Kanten und Verschmutzung prüfen."}
                DocumentationSignatureMandatory: false
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 5, UnitEstimatedDurationTimeMaintenanceStep: min}
              - _idShort: Step02
                MaintenanceStepID: "20"
                MaintenanceStepName: {en: Check and correct belt tracking, de: Gurtlauf prüfen und korrigieren}
                LocalizationDescription: {en: Deflection drum (infeed side), de: Umlenktrommel (Einlaufseite)}
                InstructionMaintenanceStep: {en: "The belt edge must run at least 5 mm from the frame on both sides. Correct with the tracking screws of the deflection drum in quarter turns.", de: "Die Gurtkante muss beidseitig mindestens 5 mm Abstand zum Gestell haben. Mit den Einstellschrauben der Umlenktrommel in Vierteldrehungen korrigieren."}
                ToolsForMaintenanceStep: [{ref: "sm:CV01/MaintenanceInstructions#MaintenanceToolList.1"}]
                QuantityOfToolsForMaintenanceStep: 1
                DocumentationSignatureMandatory: false
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 10, UnitEstimatedDurationTimeMaintenanceStep: min}
              - _idShort: Step03
                MaintenanceStepID: "30"
                MaintenanceStepName: {en: Check belt tension, de: Gurtspannung prüfen}
                LocalizationDescription: {en: Belt return side at mid-length, de: Gurtrücklauf in der Mitte der Förderlänge}
                InstructionMaintenanceStep: {en: "Measure the belt elongation with the tension gauge; set to 0.3 % (approx. 9 mm over 3 m) with both take-up screws evenly.", de: "Gurtdehnung mit dem Spannungsmessgerät messen; mit beiden Spannschrauben gleichmäßig auf 0,3 % (ca. 9 mm auf 3 m) einstellen."}
                ToolsForMaintenanceStep: [{ref: "sm:CV01/MaintenanceInstructions#MaintenanceToolList.0"}]
                QuantityOfToolsForMaintenanceStep: 1
                DocumentationSignatureMandatory: true
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 5, UnitEstimatedDurationTimeMaintenanceStep: min}
                EndOfMaintenance: true
        - _idShort: DrumBearingLubrication
          BasicMaintenanceInformation:
            # upstream template defect: semanticId is a ModelReference with key type 'Identifiable' (rejected by the
            # strict build); re-declared here as ExternalReference/GlobalReference with the same IRI
            _semanticId: https://admin-shell.io/idta/maintenanceinstructions/basicmaintenanceinformation/1/0
            MaintenanceID: CV01-M02
            NameOfMaintenance: {en: Re-greasing of the drum bearings, de: Nachschmieren der Trommellager}
            SourceOfMaintenanceInstructions: {en: "Machine manufacturer (OM-BC3000, chapter 7)", de: "Maschinenhersteller (OM-BC3000, Kapitel 7)"}
            IntervalSpecification: {MaintenanceIntervalValue: 2000, MaintenanceIntervalUnit: h}
            AlarmValues:
              Alarm:
                - _idShort: Alarm01
                  AlarmName: {en: Drum bearing lubrication due, de: Schmierung Trommellager fällig}
                  WarningLimitRelativeValue: 90
                  WarningLimitSeverity: Warning
            SafetyRegulationsToBeObserved:
              - {en: "Switch off and lock out the main switch of LINE01 before opening the drum guards.", de: "Vor dem Öffnen der Trommelschutzabdeckungen den Hauptschalter von LINE01 ausschalten und sichern."}
          MaintenanceTechnicians:
            NumberOfRequiredTechnicians: 1
            RequiredQualification: [{en: "Trained maintenance personnel (mechanics)", de: "Unterwiesenes Instandhaltungspersonal (Mechanik)"}]
            EstimatedTotalWorkingTime: {ValueTotalEstimatedWorkingTime: 15, UnitValueTotalEstimatedWorkingTime: min}
          ListMaintenanceSteps:
            MaintenanceStep:
              - _idShort: Step01
                MaintenanceStepID: "10"
                MaintenanceStepName: {en: Re-grease drum bearings, de: Trommellager nachschmieren}
                LocalizationDescription: {en: "Grease nipples of the drive and deflection drum bearings (4 ×)", de: "Schmiernippel der Lager von Antriebs- und Umlenktrommel (4 ×)"}
                InstructionMaintenanceStep: {en: "Clean the grease nipples and apply 2 g of grease per bearing with the grease gun. Run the belt for 1 min and remove escaping grease.", de: "Schmiernippel reinigen und je Lager 2 g Fett mit der Fettpresse einbringen. Band 1 min laufen lassen und austretendes Fett entfernen."}
                ConsumablesForMaintenanceStep: [{ref: "sm:CV01/MaintenanceInstructions#MaintenanceConsumablesList.0"}]
                QuantityOfConsumablesForMaintenanceStep: [8]
                UnitForQuantityOfConsumablesForMaintenanceStep: g
                ToolsForMaintenanceStep: [{ref: "sm:CV01/MaintenanceInstructions#MaintenanceToolList.2"}]
                QuantityOfToolsForMaintenanceStep: 1
                DocumentationSignatureMandatory: true
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 15, UnitEstimatedDurationTimeMaintenanceStep: min}
                EndOfMaintenance: true
        - _idShort: BeltReplacement
          BasicMaintenanceInformation:
            # upstream template defect: semanticId is a ModelReference with key type 'Identifiable' (rejected by the
            # strict build); re-declared here as ExternalReference/GlobalReference with the same IRI
            _semanticId: https://admin-shell.io/idta/maintenanceinstructions/basicmaintenanceinformation/1/0
            MaintenanceID: CV01-M03
            NameOfMaintenance: {en: Belt replacement, de: Gurtwechsel}
            SourceOfMaintenanceInstructions: {en: "Machine manufacturer (OM-BC3000, chapter 8)", de: "Maschinenhersteller (OM-BC3000, Kapitel 8)"}
            IntervalSpecification: {MaintenanceIntervalValue: 20000, MaintenanceIntervalUnit: h}
            SafetyRegulationsToBeObserved:
              - {en: "Switch off and lock out the main switch of LINE01; relieve the belt tension before removing the belt.", de: "Hauptschalter von LINE01 ausschalten und sichern; Gurtspannung vor dem Abnehmen des Gurts entlasten."}
          MaintenanceTechnicians:
            NumberOfRequiredTechnicians: 2
            RequiredQualification: [{en: "Trained maintenance personnel (mechanics)", de: "Unterwiesenes Instandhaltungspersonal (Mechanik)"}]
            EstimatedTotalWorkingTime: {ValueTotalEstimatedWorkingTime: 1.5, UnitValueTotalEstimatedWorkingTime: h}
          ListMaintenanceSteps:
            MaintenanceStep:
              - _idShort: Step01
                MaintenanceStepID: "10"
                MaintenanceStepName: {en: Remove worn belt, de: Verschlissenen Gurt abnehmen}
                LocalizationDescription: {en: "Side guides, drum guards, take-up screws", de: "Seitenführungen, Trommelschutz, Spannschrauben"}
                InstructionMaintenanceStep: {en: "Remove the side guides and drum guards, release both take-up screws completely and pull the belt off the cantilevered frame side.", de: "Seitenführungen und Trommelschutz abbauen, beide Spannschrauben vollständig lösen und den Gurt zur freitragenden Gestellseite abziehen."}
                DocumentationSignatureMandatory: false
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 30, UnitEstimatedDurationTimeMaintenanceStep: min}
              - _idShort: Step02
                MaintenanceStepID: "20"
                MaintenanceStepName: {en: Fit new belt and adjust, de: Neuen Gurt auflegen und einstellen}
                LocalizationDescription: {en: Whole conveyor, de: Gesamter Förderer}
                InstructionMaintenanceStep: {en: "Fit the new endless belt observing the running direction arrow, set the tension to 0.3 % and adjust the tracking (see CV01-M01).", de: "Neuen Endlosgurt unter Beachtung des Laufrichtungspfeils auflegen, Spannung auf 0,3 % einstellen und Gurtlauf justieren (siehe CV01-M01)."}
                SparePartForMaintenanceStep: [{ref: "sm:CV01/MaintenanceInstructions#MaintenanceSparePartList.0"}]
                QuantityOfSparePartForMaintenanceStep: 1
                ToolsForMaintenanceStep: [{ref: "sm:CV01/MaintenanceInstructions#MaintenanceToolList.0"}]
                QuantityOfToolsForMaintenanceStep: 1
                DocumentationSignatureMandatory: true
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 60, UnitEstimatedDurationTimeMaintenanceStep: min}
                EndOfMaintenance: true
      MaintenanceSparePartList:
        - SparePartID: BC-SP-BELT-3000-300-G
          SparePartName: {en: "Conveyor belt PVC green, endless, 6.1 m × 300 mm", de: "Fördergurt PVC grün, endlos, 6,1 m × 300 mm"}
          CompanyNameSupplierSparePart: {en: VF Automation Systems GmbH, de: VF Automation Systems GmbH}
          OrderCodeSparePartOfManufacturer: "3000-9101"
          SparePartDescription: [{en: "2-ply polyester fabric, PVC smooth top, 2.0 mm, finger splice", de: "2-lagiges Polyestergewebe, PVC glatt, 2,0 mm, Fingerverbindung"}]
          DisposalInstructionsForSparePart: [{en: "Dispose of the worn belt as mixed plastic waste (PVC/PES).", de: "Verschlissenen Gurt als gemischten Kunststoffabfall (PVC/PES) entsorgen."}]
        - SparePartID: BC-SP-BRG-6204
          SparePartName: {en: "Deep groove ball bearing 6204-2Z with grease nipple housing", de: "Rillenkugellager 6204-2Z mit Schmiernippelgehäuse"}
          CompanyNameSupplierSparePart: {en: VF Automation Systems GmbH, de: VF Automation Systems GmbH}
          OrderCodeSparePartOfManufacturer: "3000-9205"
