tag: CV01
idShort: CV01_BeltConveyor
kind: Instance
assetType: https://virtual-factory.example/ids/assettype/BeltConveyor
displayName: {en: "Belt conveyor CV01 (BC-3000)", de: "Gurtförderer CV01 (BC-3000)"}
description:
  en: >-
    Flat belt conveyor BC-3000 (3.0 m, belt width 300 mm) with VFD-driven gear motor. Transports the finished cylinders
    from the outlet of the assembly cell AC01 past light barrier LB01 to the inspection position of QS01 (OP75).
  de: >-
    Flachgurtförderer BC-3000 (3,0 m, Gurtbreite 300 mm) mit frequenzumrichtergespeistem Getriebemotor. Transportiert
    die fertigen Zylinder vom Auslauf der Montagezelle AC01 an der Lichtschranke LB01 vorbei zur Prüfposition von
    QS01 (OP75).
thumbnail: repo:docs/screenshots/assets/conveyor.png
specificAssetIds: {serialNumber: BC3000-2025-0117, manufacturerPartId: BC-3000-300-G-018}
locationDescription: "LINE01 between assembly cell AC01 (infeed) and colour inspection QS01 / robot cell RB01 (outfeed), Hall 1 Final Assembly"
model3d:
  file: godot/devices/conveyor/view/conveyor_parts.glb
  preview: docs/screenshots/assets/conveyor.png
  title: BC-3000 belt conveyor (frame, belt, drums, side guides, gear motor)
  objectType: Machine
device:
