tag: AC01
idShort: AC01_AssemblyCell
kind: Instance
assetType: https://virtual-factory.example/ids/assettype/AssemblyCell
displayName: {en: "Assembly and test cell AC01 (AC-200)", de: "Montage- und Prüfzelle AC01 (AC-200)"}
description:
  en: >-
    Enclosed assembly and test cell AC-200 that assembles, leak-tests and function-tests ISO 15552 profile cylinders
    PC-32-80-DA-M, fits the protective cap and releases the finished cylinders onto the conveyor infeed at a takt of
    12 s (process steps OP10-OP70). Black box: the AAS describes interface, nameplate, energy and capabilities, not
    the internal stations.
  de: >-
    Eingehauste Montage- und Prüfzelle AC-200, die Profilzylinder PC-32-80-DA-M nach ISO 15552 montiert, auf
    Dichtheit und Funktion prüft, die Schutzkappe aufsetzt und die fertigen Zylinder im Takt von 12 s auf den
    Bandeinlauf abgibt (Prozessschritte OP10-OP70). Black Box: Die VWS beschreibt Schnittstelle, Typschild, Energie und
    Fähigkeiten, nicht die internen Stationen.
thumbnail: repo:docs/screenshots/assets/assembly_cell.png
specificAssetIds: {serialNumber: AC200-2025-0042, manufacturerPartId: AC-200-PC32-3P400}
locationDescription: "LINE01 start, Hall 1 Final Assembly; outlet tunnel feeds the infeed of conveyor CV01"
