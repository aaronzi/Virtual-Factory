  - template: CapabilityDescription-1.0
    values:
      CapabilitySet:
        _idShort: CapabilitySet
        CapabilityContainer:
          - _idShort: AssembleCylinderContainer
            Capability: {_idShort: AssembleCylinder, _semanticId: "https://virtual-factory.example/ids/capability/AssembleCylinder"}
            CapabilityComment: {en: "Assembly of ISO 15552 profile cylinders (OP10-OP40): piston and rod, seals, barrel, end caps", de: "Montage von Profilzylindern nach ISO 15552 (OP10-OP40): Kolben und Kolbenstange, Dichtungen, Rohr, Deckel"}
            PropertySet:
              - _idShort: AssembleCylinderProperties
                PropertyContainer:
                  - _idShort: TaktTimeContainer
                    PropertyProperty: {_idShort: TaktTime, value: "12"}
                    PropertyComment: {en: "Takt time of the cell [s]", de: "Taktzeit der Zelle [s]"}
                    SameProperty:
                      - _idShort: SameAsTechnicalDataTaktTime
                        first: "sm:AC01/CapabilityDescription#CapabilitySet.AssembleCylinderContainer.AssembleCylinderProperties.TaktTimeContainer.TaktTime"
                        second: "sm:AC01/TechnicalData#TechnicalPropertyAreas.0.Process.TaktTime"
                  - _idShort: CylinderBoreContainer
                    PropertyProperty: {_idShort: CylinderBore, value: "32"}
                    PropertyComment: {en: "Bore diameter of the cylinders that can be assembled (ISO 15552) [mm]", de: "Kolbendurchmesser der montierbaren Zylinder (ISO 15552) [mm]"}
                  - _idShort: CylinderStrokeContainer
                    PropertyProperty: {_idShort: CylinderStroke, value: "80"}
                    PropertyComment: {en: "Stroke of the cylinders that can be assembled [mm]", de: "Hub der montierbaren Zylinder [mm]"}
                  - _idShort: TighteningTorqueContainer
                    PropertyProperty: {_idShort: TighteningTorque, value: "6"}
                    PropertyComment: {en: "End-cap screw tightening torque [N m]", de: "Anziehdrehmoment der Deckelschrauben [N m]"}
          - _idShort: LeakTestContainer
            Capability: {_idShort: LeakTest, _semanticId: "https://virtual-factory.example/ids/capability/LeakTest"}
            CapabilityComment: {en: "Pressure-decay leak test of the assembled cylinder (OP50)", de: "Druckabfall-Dichtheitsprüfung des montierten Zylinders (OP50)"}
            PropertySet:
              - _idShort: LeakTestProperties
                PropertyContainer:
                  - _idShort: TestPressureContainer
                    PropertyRange: {_idShort: TestPressure, min: 1, max: 10}
                    PropertyComment: {en: "Adjustable test pressure [bar]; nominal 6 bar for PC-32-80-DA-M", de: "Einstellbarer Prüfdruck [bar]; nominal 6 bar für PC-32-80-DA-M"}
                  - _idShort: LeakRateLimitContainer
                    PropertyProperty: {_idShort: LeakRateLimit, value: "1.0"}
                    PropertyComment: {en: "Maximum permissible leak rate [cm³/min]", de: "Maximal zulässige Leckrate [cm³/min]"}
                    SameProperty:
                      - _idShort: SameAsTechnicalDataLeakRateLimit
                        first: "sm:AC01/CapabilityDescription#CapabilitySet.LeakTestContainer.LeakTestProperties.LeakRateLimitContainer.LeakRateLimit"
                        second: "sm:AC01/TechnicalData#TechnicalPropertyAreas.0.Process.LeakRateLimit"
                  - _idShort: TestTimeContainer
                    PropertyProperty: {_idShort: TestTime, value: "2"}
                    PropertyComment: {en: "Test time incl. filling and settling [s]", de: "Prüfzeit inkl. Füllen und Beruhigen [s]"}
          - _idShort: FunctionTestContainer
            Capability: {_idShort: FunctionTest, _semanticId: "https://virtual-factory.example/ids/capability/FunctionTest"}
            CapabilityComment: {en: "Full-stroke function test with stroke time measurement (OP60)", de: "Funktionsprüfung über den vollen Hub mit Hubzeitmessung (OP60)"}
            PropertySet:
              - _idShort: FunctionTestProperties
                PropertyContainer:
                  - _idShort: StrokeTimeWindowContainer
                    PropertyRange: {_idShort: StrokeTimeWindow, min: 0.28, max: 0.36}
                    PropertyComment: {en: "Accepted stroke time at 6 bar [s]", de: "Zulässige Hubzeit bei 6 bar [s]"}
                  - _idShort: TestPressureContainer
                    PropertyProperty: {_idShort: TestPressure, value: "6"}
                    PropertyComment: {en: "Operating pressure during the function test [bar]", de: "Betriebsdruck während der Funktionsprüfung [bar]"}
          - _idShort: FitProtectiveCapContainer
            Capability: {_idShort: FitProtectiveCap, _semanticId: "https://virtual-factory.example/ids/capability/FitProtectiveCap"}
            CapabilityComment: {en: "Press-fit of a red PE protective cap onto the rod end (OP70)", de: "Aufdrücken einer roten PE-Schutzkappe auf das Kolbenstangenende (OP70)"}
            PropertySet:
              - _idShort: FitProtectiveCapProperties
