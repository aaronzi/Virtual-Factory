displayName: {en: "Plant 01 of VF Pneumatics GmbH, Kaiserslautern", de: "Werk 01 der VF Pneumatics GmbH, Kaiserslautern"}
description:
  en: >-
    Production site of VF Pneumatics GmbH in Kaiserslautern (ISA-95 site). Hall 1 houses the area Final Assembly with
    the inspection & sorting line LINE01 for ISO 15552 profile cylinders. The site AAS carries the company data, the
    contacts and the ISA-95 hierarchy down to the lines.
  de: >-
    Produktionsstandort der VF Pneumatics GmbH in Kaiserslautern (ISA-95-Standort). In Halle 1 befindet sich der
    Bereich Endmontage mit der Prüf- und Sortierlinie LINE01 für ISO-15552-Profilzylinder. Die Standort-VWS enthält
    die Unternehmensdaten, die Kontakte und die ISA-95-Hierarchie bis zu den Linien.
thumbnail: repo:docs/screenshots/assets/hall.png
location: [0, 0, 0]
locationDescription: "Plant 01, Hall 1 (final assembly, 1 floor): origin of the hall coordinate system at the hall floor centre"
