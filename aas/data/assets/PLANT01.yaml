          RoleOfContactPerson: "0173-1#07-AAS927#001"
          $include: common/address_vf_pneumatics.yaml
          Department: {en: Plant management Plant 01, de: Werkleitung Werk 01}
        - _idShort: ProductionFinalAssembly
          RoleOfContactPerson: "0173-1#07-AAS931#001"
