  - template: HierarchicalStructures-1.1
    values:
      ArcheType: Full
      EntryNode:
        entityType: SelfManagedEntity
        globalAssetId: ${asset:PLANT01}
        statements:
          Node:
            - _idShort: FinalAssembly
              _description: {en: "ISA-95 area Final Assembly in Hall 1", de: "ISA-95-Bereich Endmontage in Halle 1"}
              entityType: CoManagedEntity
              statements:
                "+HierarchyLevel": {value: Area, description: {en: "ISA-95 equipment hierarchy level", de: "ISA-95-Hierarchieebene"}}
                Node:
                  - _idShort: LINE01
                    _description: {en: "ISA-95 production line: inspection & sorting line LINE01", de: "ISA-95-Produktionslinie: Prüf- und Sortierlinie LINE01"}
                    entityType: SelfManagedEntity
                    globalAssetId: ${asset:LINE01}
                    statements:
                      "+HierarchyLevel": {value: ProductionLine, description: {en: "ISA-95 equipment hierarchy level", de: "ISA-95-Hierarchieebene"}}
                # the template allows SameAs only down to the first Node level; the relation for the line node is
                # therefore placed at the area node
                SameAs:
                  - {_idShort: SameAs_LINE01, first: "sm:PLANT01/HierarchicalStructures#EntryNode.FinalAssembly.LINE01", second: "sm:LINE01/HierarchicalStructures#EntryNode"}
                HasPart:
                  - {_idShort: HasPart_LINE01, first: "sm:PLANT01/HierarchicalStructures#EntryNode.FinalAssembly", second: "sm:PLANT01/HierarchicalStructures#EntryNode.FinalAssembly.LINE01"}
          HasPart:
            - {_idShort: HasPart_FinalAssembly, first: "sm:PLANT01/HierarchicalStructures#EntryNode", second: "sm:PLANT01/HierarchicalStructures#EntryNode.FinalAssembly"}
          "+HierarchyLevel": {value: Site, description: {en: "ISA-95 equipment hierarchy level", de: "ISA-95-Hierarchieebene"}}
