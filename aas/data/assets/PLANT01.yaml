          Phone: {TelephoneNumber: {en: "+49 631 000000-410"}, TypeOfTelephone: "0173-1#07-AAS754#001", AvailableTime: {en: "Mon-Fri 06:00-22:00 CET", de: "Mo-Fr 06:00-22:00 MEZ"}}
