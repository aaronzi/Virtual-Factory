displayName: {en: "2-finger parallel gripper GR01 (PG-85)", de: "2-Finger-Parallelgreifer GR01 (PG-85)"}
description:
  en: >-
    Electric 2-finger parallel gripper PG-85 mounted on the tool flange of robot RB01. Grips the cylinders at the
    inspection position and places them in KLT A or KLT B (OP90). Its motion is part of the robot simulation model,
    therefore it has no interface of its own.
  de: >-
    Elektrischer 2-Finger-Parallelgreifer PG-85 am Werkzeugflansch des Roboters RB01. Greift die Zylinder an der
    Prüfposition und legt sie in KLT A oder KLT B ab (OP90). Seine Bewegung ist Teil des Robotersimulationsmodells,
    daher hat er keine eigene Schnittstelle.
