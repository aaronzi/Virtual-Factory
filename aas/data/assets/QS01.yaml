tag: QS01
idShort: QS01_ColourInspection
kind: Instance
assetType: https://virtual-factory.example/ids/assettype/ColourInspectionStation
displayName: {en: "Colour inspection station QS01 (QS-100)", de: "Farbprüfstation QS01 (QS-100)"}
description:
  en: >-
    Colour inspection station QS-100 above the conveyor outfeed with the true-colour sensor Lumetra CX30 and a white LED
    ring light. Measures the colour of the protective cap in CIELAB and compares it with the taught red reference
    (ΔE76 ≤ 25, OP80); the result decides whether the robot places the cylinder in KLT A (good) or KLT B (reject).
  de: >-
    Farbprüfstation QS-100 über dem Bandauslauf mit dem Echtfarbsensor Lumetra CX30 und einem weißen LED-Ringlicht.
    Misst die Farbe der Schutzkappe im CIELAB-Farbraum und vergleicht sie mit der eingelernten roten Referenz
    (ΔE76 ≤ 25, OP80); das Ergebnis entscheidet, ob der Roboter den Zylinder in KLT A (i.O.) oder KLT B (n.i.O.)
    ablegt.
thumbnail: repo:docs/screenshots/assets/qa_station.png
specificAssetIds: {serialNumber: QS100-2025-0031, manufacturerPartId: QS-100-CX30-RL}
locationDescription: "LINE01, conveyor CV01 outfeed (inspection and pick position of robot RB01), Hall 1 Final Assembly"
model3d:
