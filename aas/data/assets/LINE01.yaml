              entityType: SelfManagedEntity
              globalAssetId: ${asset:KLTB01}
            - _idShort: PLC01
              _description: {en: Line controller LC-10, de: Liniensteuerung LC-10}
              entityType: SelfManagedEntity
              globalAssetId: ${asset:PLC01}
