tag: LINE01
idShort: LINE01_InspectionSortingLine
kind: Instance
assetType: https://virtual-factory.example/ids/assettype/ProductionLine
displayName: {en: "LINE01 inspection & sorting line", de: "LINE01 Prüf- und Sortierlinie"}
description:
  en: >-
    Final assembly line for ISO 15552 profile cylinders PC-32-80-DA-M in Hall 1 of Plant 01: assembly and test cell
    AC01, belt conveyor CV01 with light barriers LB01/LB02, colour inspection station QS01, robot cell RB01 with gripper
    GR01, output containers KLTA01 (good) and KLTB01 (reject), controlled by PLC01. Built and commissioned by
    VF Automation Systems GmbH (2025-09-15) as an assembly of machines; takt 12 s. Dynamic values (KPI variables,
    energy) are updated by the MES.
  de: >-
    Endmontagelinie für ISO-15552-Profilzylinder PC-32-80-DA-M in Halle 1 von Werk 01: Montage- und Prüfzelle AC01,
    Gurtförderer CV01 mit Lichtschranken LB01/LB02, Farbprüfstation QS01, Roboterzelle RB01 mit Greifer GR01,
    Ausgangsbehälter KLTA01 (Gut) und KLTB01 (Ausschuss), gesteuert von PLC01. Gebaut und in Betrieb genommen von
    VF Automation Systems GmbH (15.09.2025) als Gesamtheit von Maschinen; Takt 12 s. Dynamische Werte
    (KPI-Variablen, Energie) werden vom MES aktualisiert.
thumbnail: repo:docs/screenshots/m2-line.png
specificAssetIds: {serialNumber: ISL-2025-001}
location: [-1.0, 0.0, -0.3]
locationDescription: "Plant 01, Hall 1, area Final Assembly: centre of LINE01 (approx. 5.5 m x 2.5 m footprint)"
submodels:
