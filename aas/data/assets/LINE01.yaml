              entityType: SelfManagedEntity
              globalAssetId: ${asset:AC01}
            - _idShort: CV01
              _description: {en: Belt conveyor BC-3000 with light barriers, de: Gurtförderer BC-3000 mit Lichtschranken}
              entityType: SelfManagedEntity
              globalAssetId: ${asset:CV01}
              statements:
                Node:
                  - _idShort: LB01
                    _description: {en: Light barrier at the conveyor infeed, de: Lichtschranke am Bandeinlauf}
                    entityType: SelfManagedEntity
                    globalAssetId: ${asset:LB01}
                  - _idShort: LB02
                    _description: {en: Light barrier at the inspection position, de: Lichtschranke an der Prüfposition}
                    entityType: SelfManagedEntity
                    globalAssetId: ${asset:LB02}
                HasPart:
                  - {_idShort: HasPart_LB01, first: "sm:LINE01/HierarchicalStructures#EntryNode.CV01", second: "sm:LINE01/HierarchicalStructures#EntryNode.CV01.LB01"}
                  - {_idShort: HasPart_LB02, first: "sm:LINE01/HierarchicalStructures#EntryNode.CV01", second: "sm:LINE01/HierarchicalStructures#EntryNode.CV01.LB02"}
            - _idShort: QS01
              _description: {en: Colour inspection station QS-100, de: Farbprüfstation QS-100}
              entityType: SelfManagedEntity
              globalAssetId: ${asset:QS01}
            - _idShort: RB01
              _description: {en: Robot cell with UR5e and gripper, de: Roboterzelle mit UR5e und Greifer}
              entityType: SelfManagedEntity
              globalAssetId: ${asset:RB01}
              statements:
                Node:
                  - _idShort: GR01
                    _description: {en: 2-finger parallel gripper PG-85, de: 2-Finger-Parallelgreifer PG-85}
