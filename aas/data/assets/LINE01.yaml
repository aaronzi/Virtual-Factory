                    globalAssetId: ${asset:GR01}
                HasPart:
                  - {_idShort: HasPart_GR01, first: "sm:LINE01/HierarchicalStructures#EntryNode.RB01", second: "sm:LINE01/HierarchicalStructures#EntryNode.RB01.GR01"}
