  - template: CapabilityDescription-1.0
    values:
      CapabilitySet:
        - _idShort: LineCapabilities
          CapabilityContainer:
            - _idShort: SortContainer
              Capability: {_idShort: Sort, _semanticId: "https://virtual-factory.example/ids/capability/Sort"}
              CapabilityComment: {en: "Composite line capability (OP75-OP90): transport the assembled cylinder, inspect the colour of the protective cap and place it into KLT A (good) or KLT B (reject)", de: "Zusammengesetzte Linienfähigkeit (OP75-OP90): montierten Zylinder transportieren, Farbe der Schutzkappe prüfen und in KLT A (Gut) oder KLT B (Ausschuss) ablegen"}
              PropertySet:
                - _idShort: SortProperties
                  PropertyContainer:
                    - _idShort: Takt
                      PropertyProperty: [{_idShort: PlannedTaktTime, valueType: xs:double, value: 12}]
                      PropertyComment: {en: "Planned takt time of the line [s]", de: "Geplante Taktzeit der Linie [s]"}
                    - _idShort: OutputClasses
                      PropertyProperty: [{_idShort: NumberOfOutputClasses, valueType: xs:int, value: 2}]
                      PropertyComment: {en: "Output classes: good (KLT A), reject (KLT B)", de: "Ausgangsklassen: Gut (KLT A), Ausschuss (KLT B)"}
              CapabilityRelations:
                CapabilityRealizedBy:
                  - _idShort: RealizedByLineControl
                    first: "sm:LINE01/CapabilityDescription#LineCapabilities.SortContainer.Sort"
                    second: "sm:PLC01/ControlComponentInstance#Skills.Produce"
                ComposedOfSet:
                  ComposedOfContainer:
                    - _idShort: TransportInspectPlace
                      CapabilityComposedOf:
                        - {_idShort: ComposedOfTransport, first: "sm:LINE01/CapabilityDescription#LineCapabilities.SortContainer.Sort", second: "sm:LINE01/CapabilityDescription#LineCapabilities.TransportContainer.Transport"}
                        - {_idShort: ComposedOfInspectColour, first: "sm:LINE01/CapabilityDescription#LineCapabilities.SortContainer.Sort", second: "sm:LINE01/CapabilityDescription#LineCapabilities.InspectColourContainer.InspectColour"}
                        - {_idShort: ComposedOfPickAndPlace, first: "sm:LINE01/CapabilityDescription#LineCapabilities.SortContainer.Sort", second: "sm:LINE01/CapabilityDescription#LineCapabilities.PickAndPlaceContainer.PickAndPlace"}
                      ComposedOfComment: {en: "Sort = Transport (CV01) + InspectColour (QS01) + PickAndPlace (RB01), sequenced by PLC01", de: "Sortieren = Transportieren (CV01) + Farbe prüfen (QS01) + Greifen und Ablegen (RB01), vom PLC01 sequenziert"}
            - _idShort: TransportContainer
              Capability: {_idShort: Transport, _semanticId: "https://virtual-factory.example/ids/capability/Transport"}
              CapabilityComment: {en: "Provided by the belt conveyor CV01 (OP75)", de: "Bereitgestellt durch den Gurtförderer CV01 (OP75)"}
              PropertySet:
                - _idShort: TransportProperties
                  PropertyContainer:
                    - _idShort: BeltSpeed
                      PropertyProperty: [{_idShort: NominalBeltSpeed, valueType: xs:double, value: 0.25}]
                      PropertyComment: {en: "Nominal belt speed (recipe value) [m/s]", de: "Nominelle Bandgeschwindigkeit (Rezeptwert) [m/s]"}
            - _idShort: InspectColourContainer
              Capability: {_idShort: InspectColour, _semanticId: "https://virtual-factory.example/ids/capability/InspectColour"}
              CapabilityComment: {en: "Provided by the colour inspection station QS01 (OP80)", de: "Bereitgestellt durch die Farbprüfstation QS01 (OP80)"}
              PropertySet:
                - _idShort: InspectColourProperties
                  PropertyContainer:
                    - _idShort: ColourTolerance
                      PropertyProperty: [{_idShort: MaxDeltaE76, valueType: xs:double, value: 25}]
                      PropertyComment: {en: "Acceptance limit: CIE76 colour distance to the reference sRGB (0.78, 0.08, 0.10)", de: "Annahmegrenze: CIE76-Farbabstand zur Referenz sRGB (0,78; 0,08; 0,10)"}
            - _idShort: PickAndPlaceContainer
              Capability: {_idShort: PickAndPlace, _semanticId: "https://virtual-factory.example/ids/capability/PickAndPlace"}
              CapabilityComment: {en: "Provided by the robot cell RB01 with gripper GR01 (OP90)", de: "Bereitgestellt durch die Roboterzelle RB01 mit Greifer GR01 (OP90)"}
              PropertySet:
                - _idShort: PickAndPlaceProperties
                  PropertyContainer:
                    - _idShort: Payload
                      PropertyProperty: [{_idShort: MaxPayload, valueType: xs:double, value: 5}]
                      PropertyComment: {en: "Maximum payload incl. gripper [kg]", de: "Maximale Traglast inkl. Greifer [kg]"}
              CapabilityRelations:
                CapabilityRealizedBy:
                  - _idShort: RealizedByRobotSkill
                    first: "sm:LINE01/CapabilityDescription#LineCapabilities.PickAndPlaceContainer.PickAndPlace"
                    second: "sm:RB01/ControlComponentInstance#Skills.PickAndPlace"

