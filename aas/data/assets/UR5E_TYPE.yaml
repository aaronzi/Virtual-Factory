  - template: MaintenanceInstructions-1.0
    values:
      MaintenanceFreeAsset: false
      MaintenanceInstructionsForSpecificInterval:
        - _idShort: MonthlySafetyCheck
          BasicMaintenanceInformation:
            # upstream template defect: semanticId is a ModelReference with key type 'Identifiable' (rejected by the
            # strict build); same IRI re-declared as ExternalReference
            _semanticId: https://admin-shell.io/idta/maintenanceinstructions/basicmaintenanceinformation/1/0
            MaintenanceID: MI-UR5E-01
            NameOfMaintenance: {en: Monthly test of the safety functions, de: Monatliche Prüfung der Sicherheitsfunktionen}
            SourceOfMaintenanceInstructions: {en: "Integrator maintenance plan (VF Automation Systems), based on the manufacturer's user manual", de: "Wartungsplan des Integrators (VF Automation Systems) auf Basis des Herstellerhandbuchs"}
            IntervalSpecification: {MaintenanceIntervalValue: 1, MaintenanceIntervalUnit: month}
            AlarmValues:
              Alarm:
                - {AlarmName: {en: Safety check due, de: Sicherheitsprüfung fällig}, WarningLimitRelativeValue: 90, WarningLimitSeverity: warning}
            RelatedStandardsLawsRegulations:
              - {en: "EN ISO 10218-2 (robot systems and integration)", de: "EN ISO 10218-2 (Robotersysteme und Integration)"}
              - {en: "Ordinance on Industrial Safety and Health (BetrSichV)", de: "Betriebssicherheitsverordnung (BetrSichV)"}
            SafetyRegulationsToBeObserved:
              - {en: "Only instructed persons; the robot cell must be empty during the test of the fence door switch.", de: "Nur unterwiesene Personen; die Roboterzelle muss bei der Prüfung des Türschalters leer sein."}
          MaintenanceTechnicians:
            NumberOfRequiredTechnicians: 1
            RequiredQualification: [{en: "Operator instructed per OI-UR5E-PP", de: "Bediener, unterwiesen nach OI-UR5E-PP"}]
            EstimatedTotalWorkingTime: {ValueTotalEstimatedWorkingTime: 0.25, UnitValueTotalEstimatedWorkingTime: hours}
          ListMaintenanceSteps:
            MaintenanceStep:
              - _idShort: EmergencyStopTest
                MaintenanceStepID: "10"
                MaintenanceStepName: {en: Test emergency stop, de: Not-Halt prüfen}
                LocalizationDescription: {en: "Teach pendant and HMI stand", de: "Programmierhandgerät und HMI-Säule"}
                InstructionMaintenanceStep: {en: "Press the emergency stop on the teach pendant while the robot moves at reduced speed; the robot must stop. Release, reset and repeat at the HMI stand.", de: "Not-Halt am Programmierhandgerät bei langsamer Roboterbewegung betätigen; der Roboter muss stoppen. Entriegeln, quittieren und an der HMI-Säule wiederholen."}
                DocumentationSignatureMandatory: true
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 5, UnitEstimatedDurationTimeMaintenanceStep: minutes}
              - _idShort: ProtectiveStopTest
                MaintenanceStepID: "20"
                MaintenanceStepName: {en: Test fence door switch (protective stop), de: Türschalter prüfen (Schutzstopp)}
                InstructionMaintenanceStep: {en: "Open the fence door during automatic operation; the robot must perform a protective stop (RB-002) and the line controller must stop feeding.", de: "Schutztür im Automatikbetrieb öffnen; der Roboter muss einen Schutzstopp ausführen (RB-002) und die Liniensteuerung die Zuführung stoppen."}
                DocumentationSignatureMandatory: true
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 5, UnitEstimatedDurationTimeMaintenanceStep: minutes}
                EndOfMaintenance: true
        - _idShort: AnnualInspection
          BasicMaintenanceInformation:
            # upstream template defect: semanticId is a ModelReference with key type 'Identifiable' (rejected by the
            # strict build); same IRI re-declared as ExternalReference
            _semanticId: https://admin-shell.io/idta/maintenanceinstructions/basicmaintenanceinformation/1/0
            MaintenanceID: MI-UR5E-02
            NameOfMaintenance: {en: Annual inspection of robot arm and cell, de: Jährliche Inspektion von Roboterarm und Zelle}
            SourceOfMaintenanceInstructions: {en: "Integrator maintenance plan (VF Automation Systems), based on the manufacturer's service manual", de: "Wartungsplan des Integrators (VF Automation Systems) auf Basis des Hersteller-Servicehandbuchs"}
            IntervalSpecification: {MaintenanceIntervalValue: 12, MaintenanceIntervalUnit: months}
            SafetyRegulationsToBeObserved:
              - {en: "Switch off and lock out the control box before working on cables and mounting.", de: "Vor Arbeiten an Kabeln und Befestigung den Steuerschrank ausschalten und gegen Wiedereinschalten sichern."}
          MaintenanceTechnicians:
            NumberOfRequiredTechnicians: 1
            RequiredQualification: [{en: "Robot service technician trained on UR e-Series", de: "Roboter-Servicetechniker mit Schulung UR e-Series"}]
            EstimatedTotalWorkingTime: {ValueTotalEstimatedWorkingTime: 2, UnitValueTotalEstimatedWorkingTime: hours}
          ListMaintenanceSteps:
            MaintenanceStep:
              - _idShort: VisualInspection
                MaintenanceStepID: "10"
                MaintenanceStepName: {en: Visual inspection, de: Sichtprüfung}
                InstructionMaintenanceStep: {en: "Inspect joints, covers, tool flange, robot cable and teach pendant cable for damage and wear.", de: "Gelenke, Abdeckungen, Werkzeugflansch, Roboterkabel und Kabel des Programmierhandgeräts auf Schäden und Verschleiß prüfen."}
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 30, UnitEstimatedDurationTimeMaintenanceStep: minutes}
              - _idShort: MountingCheck
                MaintenanceStepID: "20"
                MaintenanceStepName: {en: Check mounting on the pedestal, de: Befestigung auf dem Sockel prüfen}
                InstructionMaintenanceStep: {en: "Check the base mounting bolts and the pedestal anchors for tightness with a torque wrench (values per installation drawing).", de: "Befestigungsschrauben des Fußes und Sockelanker mit Drehmomentschlüssel auf festen Sitz prüfen (Werte laut Aufstellzeichnung)."}
                ToolsForMaintenanceStep: [{ref: "sm:UR5E_TYPE/MaintenanceInstructions#MaintenanceToolList.0"}]
                QuantityOfToolsForMaintenanceStep: 1
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 30, UnitEstimatedDurationTimeMaintenanceStep: minutes}
              - _idShort: BrakeAndSafetyCheck
                MaintenanceStepID: "30"
                MaintenanceStepName: {en: Check joint brakes and safety configuration, de: Gelenkbremsen und Sicherheitskonfiguration prüfen}
                InstructionMaintenanceStep: {en: "Test the joint brakes per service manual and compare the safety configuration checksum with the commissioning record.", de: "Gelenkbremsen nach Servicehandbuch prüfen und Prüfsumme der Sicherheitskonfiguration mit dem Inbetriebnahmeprotokoll vergleichen."}
                DocumentationSignatureMandatory: true
                EstimatedDurationTimeMaintenanceStep: {ValueEstimatedDurationTimeMaintenanceStep: 60, UnitEstimatedDurationTimeMaintenanceStep: minutes}
                EndOfMaintenance: true
      MaintenanceToolList:
        - ToolID: TOOL-TW-25
          ToolName: {en: Torque wrench 5-25 Nm, de: Drehmomentschlüssel 5-25 Nm}
          ToolDescription: [{en: "Click-type torque wrench, 3/8 inch drive, with hex bit set", de: "Auslösender Drehmomentschlüssel, 3/8 Zoll, mit Innensechskant-Bitsatz"}]

  - template: ControlComponentType-2.0
    values:
      Skills:
        Skill:
          - _idShort: PickAndPlace
            _description: {en: "Pick the part at the taught pick position (inspection station) and place it into a slot of the target container", de: "Teil an der geteachten Greifposition (Prüfstation) aufnehmen und in ein Fach des Zielbehälters ablegen"}
            Disabled: false
            Modes:
              Mode: [{_idShort: Auto, value: AUTO}, {_idShort: Simulate, value: SIMULATE}]
            Parameters: {$include: common/control_ur5e_pickandplace_parameters.yaml}
            Errors:
              ErrorReference:
                - {ref: "sm:UR5E_TYPE/ControlComponentType#Errors.TargetUnreachable"}
                - {ref: "sm:UR5E_TYPE/ControlComponentType#Errors.ProtectiveStop"}
            Uses:
              SkillReference: [{ref: "sm:UR5E_TYPE/ControlComponentType#Skills.MoveHome"}]
          - _idShort: MoveHome
            _description: {en: "Move to the taught home pose above the inspection station (linear retract, then joint move)", de: "In die geteachte Grundstellung über der Prüfstation fahren (lineares Zurückziehen, dann Achsbewegung)"}
            Disabled: false
            Modes:
              Mode: [{_idShort: Auto, value: AUTO}, {_idShort: Manual, value: MANUAL}, {_idShort: Simulate, value: SIMULATE}]
            Parameters:
              Parameter:
                - _idShort: speed_override
                  _description: {en: "Speed slider applied to the motion", de: "Geschwindigkeitsoverride der Bewegung"}
                  Direction: In
                  Type: xs:double
                  Values:
                    "+Min": {valueType: xs:double, value: 0.0}
                    "+Max": {valueType: xs:double, value: 1.0}
                    "+Default": {valueType: xs:double, value: 1.0}
            Errors:
              ErrorReference: [{ref: "sm:UR5E_TYPE/ControlComponentType#Errors.ProtectiveStop"}]
      Interfaces:
        Interface:
          - _idShort: JobHandshake
            _description: {en: "Robot program interface of the pick & place application (VF Automation Systems)", de: "Programmschnittstelle der Pick-&-Place-Applikation (VF Automation Systems)"}
            InterfaceProfile: VF-MQTT-JobHandshake/1.0
            InterfaceProfileSupplement: >-
              Job handshake between line controller and robot program. Inputs (set by the line controller): place_target,
              place_slot, speed_override, then job_start = true (rising edge, held until job_done). Outputs (published via
              MQTT/UNS, see AssetInterfacesDescription of the instance): busy while the job runs; part_clear = true as soon as
              the part is lifted off the conveyor (line may index); job_done = true after placing, stays true until job_start
              is reset (acknowledge). fault (RB-001) and protective_stopped (RB-002) abort the job.
      Errors:
        Error:
          - _idShort: TargetUnreachable
            ErrorCode: RB-001
            "+Description": {modelType: MultiLanguageProperty, value: {en: "Target pose unreachable: inverse kinematics found no solution within the joint limits (output fault = true)", de: "Zielpose nicht erreichbar: inverse Kinematik ohne Lösung innerhalb der Gelenkgrenzen (Ausgang fault = true)"}}
            "+Remedy": {modelType: MultiLanguageProperty, value: {en: "Check the taught positions and the container placement; re-teach and restart the job", de: "Geteachte Positionen und Behälterlage prüfen; neu teachen und Job neu starten"}}
            "+Severity": {value: Error}
          - _idShort: ProtectiveStop
            ErrorCode: RB-002
            "+Description": {modelType: MultiLanguageProperty, value: {en: "Protective stop: safety input active (e.g. fence door opened) or safety limit violated (output protective_stopped = true)", de: "Schutzstopp: Sicherheitseingang aktiv (z. B. Schutztür geöffnet) oder Sicherheitsgrenze verletzt (Ausgang protective_stopped = true)"}}
            "+Remedy": {modelType: MultiLanguageProperty, value: {en: "Remove the cause, close the fence door, acknowledge on the teach pendant and resume the program", de: "Ursache beseitigen, Schutztür schließen, am Programmierhandgerät quittieren und Programm fortsetzen"}}
            "+Severity": {value: Warning}
