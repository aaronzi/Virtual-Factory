tag: UR5E_TYPE
idShort: UR5e_CollaborativeRobot
kind: Type
assetType: https://virtual-factory.example/ids/assettype/IndustrialRobot
displayName: {en: "Universal Robots UR5e collaborative robot (type)", de: "Universal Robots UR5e kollaborierender Roboter (Typ)"}
description:
  en: >-
    Product type of the 6-axis collaborative robot arm used for sorting and packing on LINE01. This AAS is maintained
    by the plant operator VF Pneumatics GmbH together with the integrator VF Automation Systems GmbH; technical values
    are taken nominatively from the public data sheet of Universal Robots A/S. It is not issued by the manufacturer.
  de: >-
    Produkttyp des 6-achsigen kollaborierenden Roboterarms für das Sortieren und Verpacken an LINE01. Diese VWS wird
    vom Betreiber VF Pneumatics GmbH gemeinsam mit dem Integrator VF Automation Systems GmbH gepflegt; technische Werte
    stammen aus dem öffentlichen Datenblatt der Universal Robots A/S. Sie wird nicht vom Hersteller herausgegeben.
thumbnail: repo:docs/screenshots/assets/ur5e.png
specificAssetIds: {manufacturerPartId: UR5e}
model3d:
  file: godot/devices/ur5e/view/ur5e.glb
  preview: docs/screenshots/assets/ur5e.png
  title: UR5e robot arm with PG-85 gripper (visualisation model)
  objectType: Robot
submodels:
  - template: Nameplate-3.0
    values: {$include: common/control_ur5e_nameplate.yaml}

  - template: TechnicalData-2.0
    values:
      GeneralInformation:
        ManufacturerName: Universal Robots A/S
        ManufacturerProductDesignation: {en: "Collaborative robot arm UR5e", de: "Kollaborierender Roboterarm UR5e"}
        ManufacturerArticleNumber: UR5e
        ManufacturerOrderCode: UR5e
        ProductImages: [{ImageFile: repo:docs/screenshots/assets/ur5e.png, ImageNote: {en: "UR5e on pedestal with PG-85 gripper (LINE01)", de: "UR5e auf Sockel mit Greifer PG-85 (LINE01)"}}]
      TechnicalPropertyAreas:
        - _idShort: TechnicalProperties
          Section:
            - _idShort: Performance
              "+Payload": {valueType: xs:double, value: 5, description: {en: "Rated payload [kg]", de: "Nenntraglast [kg]"}}
              "+Reach": {valueType: xs:double, value: 850, description: {en: "Reach [mm]", de: "Reichweite [mm]"}}
              "+DegreesOfFreedom": {valueType: xs:int, value: 6, description: {en: "Number of rotating joints", de: "Anzahl Drehgelenke"}}
              "+PoseRepeatability": {valueType: xs:double, value: 0.03, description: {en: "Pose repeatability per ISO 9283, ± [mm]", de: "Posenwiederholgenauigkeit nach ISO 9283, ± [mm]"}}
              "+TcpSpeedTypical": {valueType: xs:double, value: 1.0, description: {en: "Typical TCP speed [m/s]", de: "Typische TCP-Geschwindigkeit [m/s]"}}
            - _idShort: Joints
              "+JointWorkingRange": {valueType: xs:double, value: 360, description: {en: "Working range of all joints, ± [°]", de: "Arbeitsbereich aller Gelenke, ± [°]"}}
              "+JointSpeedMax": {valueType: xs:double, value: 180, description: {en: "Maximum speed of all joints [°/s]", de: "Maximalgeschwindigkeit aller Gelenke [°/s]"}}
            - _idShort: Physical
              "+Mass": {valueType: xs:double, value: 20.6, description: {en: "Mass of the robot arm [kg]", de: "Masse des Roboterarms [kg]"}}
              "+FootprintDiameter": {valueType: xs:double, value: 149, description: {en: "Footprint (base flange) diameter [mm]", de: "Durchmesser Standfläche (Fußflansch) [mm]"}}
            - _idShort: Environment
              "+DegreeOfProtection": {value: IP54, description: {en: "Degree of protection of the arm (IEC 60529)", de: "Schutzart des Arms (IEC 60529)"}}
              "+AmbientTemperatureMin": {valueType: xs:double, value: 0, description: {en: "Minimum ambient temperature [°C]", de: "Minimale Umgebungstemperatur [°C]"}}
              "+AmbientTemperatureMax": {valueType: xs:double, value: 50, description: {en: "Maximum ambient temperature [°C]", de: "Maximale Umgebungstemperatur [°C]"}}
              "+NoiseLevel": {valueType: xs:double, value: 65, description: {en: "Sound pressure level, less than [dB(A)]", de: "Schalldruckpegel, kleiner als [dB(A)]"}}
            - _idShort: Electrical
              "+PowerConsumptionTypical": {valueType: xs:double, value: 200, description: {en: "Typical power consumption with a moderate operating program [W]", de: "Typische Leistungsaufnahme bei moderatem Programm [W]"}}
              "+PowerConsumptionMax": {valueType: xs:double, value: 570, description: {en: "Maximum power consumption [W]", de: "Maximale Leistungsaufnahme [W]"}}
              "+SupplyVoltage": {value: "100-240 V AC, 47-440 Hz (control box)", description: {en: "Mains supply of the control box", de: "Netzversorgung des Steuerschranks"}}
            - _idShort: Safety
              "+ConfigurableSafetyFunctions": {valueType: xs:int, value: 17, description: {en: "Number of configurable safety functions", de: "Anzahl konfigurierbarer Sicherheitsfunktionen"}}
              "+PerformanceLevel": {value: "PL d, Category 3 (EN ISO 13849-1)", description: {en: "Performance level of the safety functions", de: "Performance Level der Sicherheitsfunktionen"}}
      FurtherInformation:
        TextStatement:
          - en: "Values taken from the public UR5e data sheet of Universal Robots A/S and compiled by the plant operator; the manufacturer's current documentation prevails."
            de: "Werte aus dem öffentlichen UR5e-Datenblatt der Universal Robots A/S, zusammengestellt vom Betreiber; maßgeblich ist die aktuelle Herstellerdokumentation."
          - en: "Collaborative operation requires a risk assessment of the complete application (EN ISO 10218-2, ISO/TS 15066)."
            de: "Kollaborierender Betrieb erfordert eine Risikobeurteilung der gesamten Applikation (EN ISO 10218-2, ISO/TS 15066)."
        ValidDate: "2025-08-01"

