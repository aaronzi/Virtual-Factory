  - template: ControlComponentType-2.0
    values:
      Skills:
        Skill:
          - _idShort: Produce
            _description: {en: "Run the line: release parts from the assembly cell, transport, inspect and sort them into KLT A/B (OP75-OP90)", de: "Linie betreiben: Teile aus der Montagezelle freigeben, transportieren, prüfen und in KLT A/B sortieren (OP75-OP90)"}
            Disabled: false
            Modes:
              Mode: [{_idShort: Production, value: Production}, {_idShort: Maintenance, value: Maintenance}, {_idShort: Manual, value: Manual}]
            Parameters: {$include: common/control_lc10_produce_parameters.yaml}
            Errors:
              ErrorReference:
                - {ref: "sm:LC10_TYPE/ControlComponentType#Errors.InfeedTrackingTimeout"}
                - {ref: "sm:LC10_TYPE/ControlComponentType#Errors.RobotFault"}
                - {ref: "sm:LC10_TYPE/ControlComponentType#Errors.ContainerFull"}
            Uses:
              SkillReference:
                - {ref: "sm:LC10_TYPE/ControlComponentType#Skills.ExchangeContainer"}
                - {ref: "sm:UR5E_TYPE/ControlComponentType#Skills.PickAndPlace"}
          - _idShort: ExchangeContainer
            _description: {en: "Request the exchange of a full small load carrier and reset its slot counter", de: "Wechsel eines vollen Kleinladungsträgers anfordern und seinen Fachzähler zurücksetzen"}
            Disabled: false
            Modes:
              Mode: [{_idShort: Production, value: Production}, {_idShort: Maintenance, value: Maintenance}, {_idShort: Manual, value: Manual}]
            Parameters:
              Parameter:
                - _idShort: container
                  _description: {en: "Container to exchange: 1 = KLT A (good), 2 = KLT B (reject)", de: "Zu wechselnder Behälter: 1 = KLT A (Gut), 2 = KLT B (Ausschuss)"}
                  Direction: In
                  Type: xs:int
                  Values:
                    "+KLT_A": {valueType: xs:int, value: 1, description: {en: "KLT A, good parts", de: "KLT A, Gutteile"}}
                    "+KLT_B": {valueType: xs:int, value: 2, description: {en: "KLT B, rejected parts", de: "KLT B, Ausschussteile"}}
                - _idShort: exchange_delay
                  _description: {en: "Time for the automatic exchange [s]", de: "Dauer des automatischen Wechsels [s]"}
                  Direction: In
                  Type: xs:double
                  Values:
                    "+Default": {valueType: xs:double, value: 4.0}
                    "+Unit": {value: s}
            Errors:
              ErrorReference: [{ref: "sm:LC10_TYPE/ControlComponentType#Errors.ContainerFull"}]
      Interfaces:
        Interface:
          - _idShort: PackML
            _description: {en: "Machine state model and commands of the line", de: "Maschinenzustandsmodell und Befehle der Linie"}
            InterfaceProfile: "ISA-TR88.00.02 PackML (state model, commands 1-9)"
            InterfaceProfileSupplement: >-
              MQTT/UNS, see AssetInterfacesDescription of the instance. State: property packml_state (Int32; 1 Clearing,
              2 Stopped, 3 Starting, 4 Idle, 5 Suspended, 6 Execute, 7 Stopping, 8 Aborting, 9 Aborted, 10 Holding, 11 Held,
              12 Unholding, 13 Suspending, 14 Unsuspending, 15 Resetting, 16 Completing, 17 Complete). Command: action
              packml_command (Int32; 1 Reset, 2 Start, 3 Stop, 4 Hold, 5 Unhold, 6 Suspend, 7 Unsuspend, 8 Abort, 9 Clear),
              edge-triggered on change, QoS 1, not retained. Unit mode (Production, Maintenance, Manual) = skill mode.
      Errors:
        Error:
          - _idShort: InfeedTrackingTimeout
            ErrorCode: PLC-001
            "+Description": {modelType: MultiLanguageProperty, value: {en: "Infeed tracking timeout: a part released by AC01 was not detected by LB01 within infeed_timeout (8 s); counter infeed_faults is incremented and the serial number assignment may be lost", de: "Timeout der Einlaufverfolgung: ein von AC01 freigegebenes Teil wurde nicht innerhalb von infeed_timeout (8 s) von LB01 erkannt; der Zähler infeed_faults wird erhöht und die Seriennummernzuordnung kann verloren gehen"}}
            "+Remedy": {modelType: MultiLanguageProperty, value: {en: "Check the transfer point AC01/CV01 and the alignment of LB01; remove misplaced parts", de: "Übergabestelle AC01/CV01 und Ausrichtung von LB01 prüfen; verlegte Teile entfernen"}}
            "+Severity": {value: Warning}
          - _idShort: RobotFault
            ErrorCode: PLC-002
            "+Description": {modelType: MultiLanguageProperty, value: {en: "Robot fault reported by RB01 (input rb_fault, e.g. RB-001 target unreachable); red stack light, no further pick jobs are issued", de: "Roboterstörung von RB01 gemeldet (Eingang rb_fault, z. B. RB-001 Ziel nicht erreichbar); rote Signalleuchte, keine weiteren Greifaufträge"}}
            "+Remedy": {modelType: MultiLanguageProperty, value: {en: "Hold the line (command 4), clear the robot fault, then Unhold (command 5)", de: "Linie anhalten (Befehl 4 Hold), Roboterstörung beheben, dann Unhold (Befehl 5)"}}
            "+Severity": {value: Error}
          - _idShort: ContainerFull
            ErrorCode: PLC-003
            "+Description": {modelType: MultiLanguageProperty, value: {en: "Target container full (klt_capacity reached): the line changes to Suspended (5) until the KLT has been exchanged, then resumes automatically (Unsuspend)", de: "Zielbehälter voll (klt_capacity erreicht): die Linie wechselt nach Suspended (5), bis der KLT gewechselt ist, und setzt dann automatisch fort (Unsuspend)"}}
            "+Remedy": {modelType: MultiLanguageProperty, value: {en: "Exchange the full KLT (automatic if auto_exchange = true)", de: "Vollen KLT wechseln (automatisch bei auto_exchange = true)"}}
            "+Severity": {value: Info}
