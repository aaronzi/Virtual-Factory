tag: LC10_TYPE
idShort: LC10_LineController
kind: Type
assetType: https://virtual-factory.example/ids/assettype/LineController
displayName: {en: "Line controller LC-10 (type)", de: "Liniensteuerung LC-10 (Typ)"}
description:
  en: >-
    Fanless industrial PC with an IEC 61131-3 soft-PLC runtime for the control of small assembly and inspection lines.
    In LINE01 it runs the "SortingLine" PLC program (infeed interlock, part tracking, inspection, robot job handshake,
    KLT handling) with an ISA-TR88.00.02 (PackML) state model, published via MQTT to the Unified Namespace.
  de: >-
    Lüfterloser Industrie-PC mit IEC-61131-3-Soft-SPS-Laufzeit zur Steuerung kleiner Montage- und Prüflinien. In
    LINE01 führt er das SPS-Programm "SortingLine" aus (Einlaufverriegelung, Teileverfolgung, Prüfung, Roboter-Job-
    Handshake, KLT-Handling) mit einem Zustandsmodell nach ISA-TR88.00.02 (PackML), veröffentlicht per MQTT im Unified
    Namespace.
thumbnail: repo:docs/screenshots/assets/props.png
specificAssetIds: {manufacturerPartId: LC-10-24DC-M}
submodels:
