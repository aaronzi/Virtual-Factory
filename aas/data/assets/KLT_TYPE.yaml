description:
  en: >-
    Product type of the output containers of LINE01: VDA 4500 small load carrier KLT 6428 with a 4 × 3 slot insert for
    12 upright cylinders on a powder-coated stand with fill-level detection. Colour variants blue (good parts) and red
    (rejects).
  de: >-
    Produkttyp der Ausgangsbehälter von LINE01: Kleinladungsträger KLT 6428 nach VDA 4500 mit 4 × 3-Facheinsatz für
    12 stehende Zylinder auf einem pulverbeschichteten Gestell mit Füllstandserkennung. Farbvarianten blau (Gutteile)
    und rot (Ausschuss).
